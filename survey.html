<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Surveykshan Survey</title>

    <link rel="stylesheet" href="style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            width: 100%;
            background: #1565c0;
            color: white;
            padding: 14px 10px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            line-height: 1.3;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 700px;
            margin: 15px auto;
            padding: 10px;
        }


        /* =========================
           SURVEY BOX
        ========================= */

        .survey-box {
            width: 100%;
            max-width: 100%;
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .15);
        }


        .survey-box h2 {
            text-align: center;
            color: #1565c0;
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 24px;
        }


        /* =========================
           LABELS
        ========================= */

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 15px;
        }


        .required {
            color: red;
        }


        /* =========================
           INPUTS
        ========================= */

        input,
        select,
        textarea {
            display: block;
            width: 100%;
            max-width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: Arial, sans-serif;
            background: white;
        }


        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #1565c0;
            box-shadow: 0 0 0 2px rgba(21, 101, 192, .12);
        }


        textarea {
            min-height: 100px;
            resize: vertical;
        }


        /* =========================
           DAILY LIMIT
        ========================= */

        #dailyLimitBox,
        #dailyProgressBox {
            width: 100%;
            max-width: 100%;
            background: #e3f2fd;
            border: 1px solid #90caf9;
            padding: 14px;
            margin: 18px 0;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            color: #0d47a1;
        }


        #todayCount,
        #remainingCount {
            font-size: 18px;
        }


        /* =========================
           MESSAGE
        ========================= */

        #message {
            width: 100%;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            line-height: 1.5;
        }


        /* =========================
           BUTTON
        ========================= */

        #submitSurvey {
            display: block;
            width: 100%;
            max-width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }


        #submitSurvey:hover {
            background: #0d47a1;
        }


        #submitSurvey:disabled {
            background: #9e9e9e;
            cursor: not-allowed;
            opacity: .7;
        }


        /* =========================
           LOGOUT
        ========================= */

        .logout-btn {
            width: 100%;
            padding: 11px;
            margin-top: 10px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }


        /* =========================
           QUESTION AREA
        ========================= */

        #questionStep,
        #basicDetailsStep {
            width: 100%;
            max-width: 100%;
        }


        #questionOptions {
            width: 100%;
            max-width: 100%;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                width: 100%;
                overflow-x: hidden;
            }


            .header {
                width: 100%;
                padding: 12px 8px;
                font-size: 19px;
            }


            .container {
                width: 100%;
                max-width: 100%;
                margin: 8px 0;
                padding: 8px;
            }


            .survey-box {
                width: 100%;
                padding: 16px 14px;
                border-radius: 10px;
            }


            .survey-box h2 {
                font-size: 20px;
                margin-bottom: 15px;
            }


            label {
                font-size: 14px;
                margin-top: 12px;
            }


            input,
            select,
            textarea {
                width: 100%;
                max-width: 100%;
                font-size: 16px;
                padding: 12px;
            }


            textarea {
                min-height: 90px;
            }


            #dailyLimitBox,
            #dailyProgressBox {
                width: 100%;
                padding: 12px;
                margin: 15px 0;
                font-size: 14px;
            }


            #todayCount,
            #remainingCount {
                font-size: 17px;
            }


            #submitSurvey {
                width: 100%;
                padding: 13px;
                font-size: 16px;
            }


            #message {
                font-size: 14px;
            }

        }


        /* =========================
           VERY SMALL MOBILE
        ========================= */

        @media (max-width: 380px) {

            .container {
                padding: 5px;
            }


            .survey-box {
                padding: 13px 10px;
            }


            .header {
                font-size: 18px;
                padding: 11px 6px;
            }


            .survey-box h2 {
                font-size: 18px;
            }


            input,
            select,
            textarea {
                font-size: 15px;
                padding: 11px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">
        Surveykshan Survey Form
    </div>


    <!-- =========================
         MAIN CONTAINER
    ========================= -->

    <div class="container">

        <div class="survey-box">


            <!-- =========================
                 TITLE
            ========================= -->

            <h2>
                Public Opinion Survey
            </h2>


            <!-- =========================
                 BASIC DETAILS
            ========================= -->

            <div id="basicDetailsStep">


                <!-- NAME -->

                <label for="name">
                    Name <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter Name"
                    autocomplete="off"
                >


                <!-- MOBILE -->

                <label for="mobile">
                    Mobile <span class="required">*</span>
                </label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter Mobile Number"
                    inputmode="numeric"
                    maxlength="10"
                    autocomplete="off"
                >


                <!-- AGE -->

                <label for="age">
                    Age <span class="required">*</span>
                </label>

                <input
                    type="number"
                    id="age"
                    placeholder="Enter Age"
                    min="1"
                    max="120"
                >


                <!-- GENDER -->

                <label for="gender">
                    Gender <span class="required">*</span>
                </label>

                <select id="gender">

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <!-- VILLAGE -->

                <label for="village">
                    Village <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="village"
                    placeholder="Enter Village"
                    autocomplete="off"
                >


                <!-- DISTRICT -->

                <label for="district">
                    District <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="district"
                    placeholder="Enter District"
                    autocomplete="off"
                >


                <!-- PINCODE -->

                <label for="pincode">
                    PIN Code <span class="required">*</span>
                </label>

                <input
                    type="tel"
                    id="pincode"
                    placeholder="Enter 6 digit PIN Code"
                    inputmode="numeric"
                    maxlength="6"
                    autocomplete="off"
                >


                <!-- DAILY PROGRESS -->

                <div id="dailyLimitBox">

                    Today's Surveys:
                    <span id="todayCount">0</span>

                    <br>

                    Remaining:
                    <span id="remainingCount">Loading...</span>

                </div>


                <!-- MESSAGE -->

                <div id="message"></div>


                <!-- NEXT -->

                <button
                    id="basicNextButton"
                    type="button"
                    style="
                        width:100%;
                        padding:13px;
                        margin-top:18px;
                        background:#1565c0;
                        color:white;
                        border:none;
                        border-radius:7px;
                        font-size:16px;
                        font-weight:bold;
                        cursor:pointer;
                    "
                >
                    Next →
                </button>

            </div>


            <!-- =========================
                 QUESTION STEP
            ========================= -->

            <div
                id="questionStep"
                class="question-step"
                style="display:none;"
            >


                <div
                    id="questionNumber"
                    style="
                        margin-top:10px;
                        margin-bottom:10px;
                        font-weight:bold;
                        color:#1565c0;
                    "
                >
                </div>


                <div
                    id="questionText"
                    style="
                        font-size:18px;
                        font-weight:bold;
                        line-height:1.5;
                        margin-bottom:15px;
                    "
                >
                    Loading questions...
                </div>


                <div id="questionOptions"></div>


                <!-- QUESTION NAVIGATION -->

                <div
                    style="
                        display:flex;
                        gap:10px;
                        margin-top:20px;
                    "
                >

                    <button
                        id="previousButton"
                        type="button"
                        style="
                            flex:1;
                            padding:12px;
                            border:none;
                            border-radius:7px;
                            background:#757575;
                            color:white;
                            font-weight:bold;
                            cursor:pointer;
                        "
                    >
                        ← Previous
                    </button>


                    <button
                        id="nextButton"
                        type="button"
                        style="
                            flex:1;
                            padding:12px;
                            border:none;
                            border-radius:7px;
                            background:#1565c0;
                            color:white;
                            font-weight:bold;
                            cursor:pointer;
                        "
                    >
                        Next →
                    </button>

                </div>


                <!-- FINAL SUBMIT -->

                <button
                    id="submitSurvey"
                    type="button"
                >
                    Submit Survey
                </button>


            </div>


        </div>

    </div>


    <!-- =========================
         FIREBASE
    ========================= -->

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js">
    </script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js">
    </script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js">
    </script>


    <!-- =========================
         FIREBASE CONFIG
    ========================= -->

    <script src="firebase.js">
    </script>


    <!-- =========================
         SURVEY JS
    ========================= -->

    <script src="survey.js">
    </script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surveykshan Survey</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* =====================================================
           GLOBAL
        ===================================================== */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        /* =====================================================
           HEADER
        ===================================================== */
        .header {
            width: 100%;
            background: #1565c0;
            color: white;
            padding: 16px 12px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            line-height: 1.3;
        }

        /* =====================================================
           MAIN CONTAINER
        ===================================================== */
        .container {
            width: 100%;
            max-width: 720px;
            margin: 20px auto;
            padding: 10px;
        }

        /* =====================================================
           SURVEY CARD
        ===================================================== */
        .survey-box {
            width: 100%;
            background: #ffffff;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 3px 18px rgba(0, 0, 0, 0.12);
        }

        .survey-box h2 {
            text-align: center;
            color: #1565c0;
            margin: 0 0 25px 0;
            font-size: 28px;
            line-height: 1.25;
        }

        /* =====================================================
           LABELS & INPUTS
        ===================================================== */
        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 16px;
            color: #111;
        }

        .required {
            color: red;
        }

        input,
        select,
        textarea {
            display: block;
            width: 100%;
            max-width: 100%;
            padding: 14px;
            border: 1px solid #cccccc;
            border-radius: 9px;
            box-sizing: border-box;
            font-size: 16px;
            font-family: Arial, sans-serif;
            background: #ffffff;
            min-height: 50px;
        }

        input::placeholder,
        textarea::placeholder {
            color: #777;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #1565c0;
            box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.12);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* =====================================================
           DAILY LIMIT BOX
        ===================================================== */
        #dailyLimitBox {
            width: 100%;
            background: #e3f2fd;
            border: 1px solid #90caf9;
            padding: 15px;
            margin: 20px 0;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            color: #0d47a1;
            line-height: 1.6;
        }

        #todayCount,
        #remainingCount {
            font-size: 20px;
        }

        #message {
            width: 100%;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            line-height: 1.5;
            font-size: 15px;
        }

        /* =====================================================
           BUTTONS & NAVIGATION
        ===================================================== */
        #basicNextButton,
        #submitSurvey {
            display: block;
            width: 100% !important;
            padding: 15px !important;
            margin-top: 20px !important;
            background: #1565c0 !important;
            color: white !important;
            border: none !important;
            border-radius: 9px !important;
            font-size: 18px !important;
            font-weight: bold !important;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        #basicNextButton:hover,
        #submitSurvey:hover {
            background: #0d47a1 !important;
        }

        #basicNextButton:disabled,
        #submitSurvey:disabled {
            background: #9e9e9e !important;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .question-navigation {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 22px;
        }

        .question-navigation button {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            min-height: 50px;
        }

        #previousButton {
            background: #757575;
        }

        #nextButton {
            background: #1565c0;
        }

        #previousButton:disabled,
        #nextButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #questionNumber {
            margin-top: 10px;
            margin-bottom: 12px;
            font-weight: bold;
            color: #1565c0;
            font-size: 16px;
        }

        #questionText {
            font-size: 19px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        /* =====================================================
           MOBILE RESPONSIVENESS
        ===================================================== */
        @media (max-width: 600px) {
            .container {
                margin: 6px 0;
                padding: 6px;
            }

            .survey-box {
                padding: 20px 15px;
                border-radius: 14px;
            }

            .survey-box h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        Surveykshan Survey Form
    </div>

    <div class="container">
        <div class="survey-box">

            <h2>Public Opinion Survey</h2>

            <!-- =================================================
                 STEP 1: BASIC DETAILS
            ================================================== -->
            <div id="basicDetailsStep">

                <label for="name">Name <span class="required">*</span></label>
                <input type="text" id="name" placeholder="Enter Name" autocomplete="off" required>

                <label for="mobile">Mobile <span class="required">*</span></label>
                <input type="tel" id="mobile" placeholder="Enter Mobile Number" inputmode="numeric" maxlength="10" autocomplete="off" required>

                <label for="age">Age <span class="required">*</span></label>
                <input type="number" id="age" placeholder="Enter Age" min="1" max="120" required>

                <label for="gender">Gender <span class="required">*</span></label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>

                <label for="village">Village <span class="required">*</span></label>
                <input type="text" id="village" placeholder="Enter Village" autocomplete="off" required>

                <label for="district">District <span class="required">*</span></label>
                <input type="text" id="district" placeholder="Enter District" autocomplete="off" required>

                <label for="pincode">PIN Code <span class="required">*</span></label>
                <input type="tel" id="pincode" placeholder="Enter 6 digit PIN Code" inputmode="numeric" maxlength="6" autocomplete="off" required>

                <!-- Daily Progress Box -->
                <div id="dailyLimitBox">
                    📊 Today's Surveys: <span id="todayCount">0</span>
                    <br>
                    Remaining: <span id="remainingCount">Loading...</span>
                </div>

                <div id="message"></div>

                <button id="basicNextButton" type="button">Next →</button>
            </div>

            <!-- =================================================
                 STEP 2: QUESTION STEP
            ================================================== -->
            <div id="questionStep" style="display: none;">

                <div id="questionNumber"></div>
                <div id="questionText">Loading questions...</div>
                <div id="questionOptions"></div>

                <div class="question-navigation">
                    <button id="previousButton" type="button">← Previous</button>
                    <button id="nextButton" type="button">Next →</button>
                </div>

                <button id="submitSurvey" type="button" style="display: none;">Submit Survey</button>
            </div>

        </div>
    </div>

    <!-- Firebase SDKs (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- App Config & Logic -->
    <script src="firebase.js"></script>
    <!-- Cache-buster parameter (?v=101) ensures the app loads the latest survey.js -->
    <script src="survey.js?v=101"></script>

</body>

</html>

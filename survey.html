<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surveykshan Survey</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .header {
            width: 100%;
            background: #1565c0;
            color: white;
            padding: 16px 12px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            line-height: 1.3;
        }

        .container {
            width: 100%;
            max-width: 720px;
            margin: 15px auto;
            padding: 10px;
        }

        .survey-box {
            width: 100%;
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 3px 18px rgba(0, 0, 0, 0.1);
        }

        .survey-box h2 {
            text-align: center;
            color: #1565c0;
            margin: 0 0 20px 0;
            font-size: 26px;
        }

        .step-heading {
            font-size: 19px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 15px;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 15px;
            color: #1e293b;
        }

        .required {
            color: red;
        }

        input,
        select,
        textarea {
            display: block;
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            background: #ffffff;
            min-height: 48px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #1565c0;
            box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.12);
        }

        /* Location Card */
        .location-container {
            background: #f0fdf4;
            border: 2px dashed #86efac;
            border-radius: 14px;
            padding: 24px 16px;
            text-align: center;
            margin: 20px 0;
        }

        .location-coords {
            font-size: 20px;
            font-weight: 700;
            color: #166534;
            margin: 12px 0;
        }

        .refresh-btn {
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Photo Upload Card */
        .photo-container {
            background: #f8fafc;
            border: 2px dashed #94a3b8;
            border-radius: 14px;
            padding: 24px 16px;
            text-align: center;
            margin: 20px 0;
        }

        .photo-preview-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
            justify-content: center;
        }

        .photo-preview-grid img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #2563eb;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Daily Progress */
        #dailyLimitBox {
            background: #e3f2fd;
            border: 1px solid #90caf9;
            padding: 14px;
            margin: 20px 0;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            color: #0d47a1;
            line-height: 1.5;
        }

        #todayCount,
        #remainingCount {
            font-size: 19px;
        }

        #message {
            margin-top: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }

        /* Action Buttons */
        .btn-full {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-full:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .step-nav {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .step-nav button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-prev {
            background: #64748b;
        }

        .btn-next {
            background: #1565c0;
        }

        #questionNumber {
            margin-top: 10px;
            margin-bottom: 8px;
            font-weight: bold;
            color: #1565c0;
            font-size: 15px;
        }

        #questionText {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 16px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 5px 0;
                padding: 6px;
            }

            .survey-box {
                padding: 20px 14px;
            }

            .survey-box h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        Surveykshan Survey Form
    </div>

    <div class="container">
        <div class="survey-box">

            <h2>Public Opinion Survey</h2>

            <!-- =================================================
                 STEP 1: BASIC DETAILS
            ================================================== -->
            <div id="stepBasic">
                <label for="name">Name <span class="required">*</span></label>
                <input type="text" id="name" placeholder="Enter Name" autocomplete="off" required>

                <label for="mobile">Mobile <span class="required">*</span></label>
                <input type="tel" id="mobile" placeholder="Enter Mobile Number" inputmode="numeric" maxlength="10" autocomplete="off" required>

                <label for="age">Age <span class="required">*</span></label>
                <input type="number" id="age" placeholder="Enter Age" min="1" max="120" required>

                <label for="gender">Gender <span class="required">*</span></label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>

                <label for="village">Village <span class="required">*</span></label>
                <input type="text" id="village" placeholder="Enter Village" autocomplete="off" required>

                <label for="district">District <span class="required">*</span></label>
                <input type="text" id="district" placeholder="Enter District" autocomplete="off" required>

                <label for="pincode">PIN Code <span class="required">*</span></label>
                <input type="tel" id="pincode" placeholder="Enter 6 digit PIN Code" inputmode="numeric" maxlength="6" autocomplete="off" required>

                <div id="dailyLimitBox">
                    📊 Today's Surveys: <span id="todayCount">0</span>
                    <br>
                    Remaining: <span id="remainingCount">Loading...</span>
                </div>

                <div id="message"></div>

                <button id="btnBasicNext" class="btn-full" type="button">Next →</button>
            </div>

            <!-- =================================================
                 STEP 2: QUESTIONS WIZARD
            ================================================== -->
            <div id="stepQuestions" style="display: none;">
                <div id="questionNumber"></div>
                <div id="questionText">Loading questions...</div>
                <div id="questionOptions"></div>

                <div class="step-nav">
                    <button id="btnQuestionsPrev" class="btn-prev" type="button">← Previous</button>
                    <button id="btnQuestionsNext" class="btn-next" type="button">Next →</button>
                </div>
            </div>

            <!-- =================================================
                 STEP 3: GPS LOCATION (PERMANENT STEP)
            ================================================== -->
            <div id="stepLocation" style="display: none;">
                <div class="step-heading">📍 Location Verification (अनिवार्य)</div>
                <p style="text-align:center; color:#64748b; font-size:14px;">कृपया सटीक GPS लोकेशन कैप्चर करें:</p>

                <div class="location-container">
                    <div style="font-size:32px;">📍</div>
                    <div id="locationCoords" class="location-coords">लोकेशन प्राप्त की जा रही है...</div>
                    <button type="button" class="refresh-btn" onclick="fetchLocation()">🔄 Refresh Location</button>
                </div>

                <div class="step-nav">
                    <button id="btnLocationPrev" class="btn-prev" type="button">← Previous</button>
                    <button id="btnLocationNext" class="btn-next" type="button">Next (Photo Capture) →</button>
                </div>
            </div>

            <!-- =================================================
                 STEP 4: PHOTOS & FINAL SUBMIT (PERMANENT STEP)
            ================================================== -->
            <div id="stepPhotos" style="display: none;">
                <div class="step-heading">📷 Survey Photos (Max 4 Photos)</div>
                <p style="text-align:center; color:#64748b; font-size:14px;">सर्वे स्थल या व्यक्ति की अधिकतम 4 तस्वीरें लें:</p>

                <div class="photo-container">
                    <input type="file" id="surveyPhotosInput" accept="image/*" multiple style="border:none; padding:6px; min-height:auto;">
                    <div id="photoGrid" class="photo-preview-grid"></div>
                </div>

                <div class="step-nav">
                    <button id="btnPhotosPrev" class="btn-prev" type="button">← Previous</button>
                    <button id="btnFinalSubmit" class="btn-next" type="button" style="background:#16a34a;">Submit Survey ✅</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Firebase SDKs (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- App Scripts -->
    <script src="firebase.js"></script>
    <script src="survey.js?v=201"></script>

</body>
</html>

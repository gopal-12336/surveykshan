<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surveykshan Survey</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .header {
            width: 100%;
            background: #1565c0;
            color: white;
            padding: 16px 12px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            line-height: 1.3;
        }

        .container {
            width: 100%;
            max-width: 720px;
            margin: 15px auto;
            padding: 10px;
        }

        .survey-box {
            width: 100%;
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 3px 18px rgba(0, 0, 0, 0.1);
        }

        .survey-box h2 {
            text-align: center;
            color: #1565c0;
            margin: 0 0 20px 0;
            font-size: 26px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 15px;
            color: #1e293b;
        }

        .required {
            color: red;
        }

        input,
        select,
        textarea {
            display: block;
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            background: #ffffff;
            min-height: 48px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #1565c0;
            box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.12);
        }

        /* Location Box */
        .location-badge {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 9px;
            padding: 12px 14px;
            margin-top: 15px;
            font-size: 14px;
            color: #166534;
            font-weight: 600;
        }

        .refresh-loc-btn {
            background: #16a34a;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        /* Photo Upload Styling */
        .photo-upload-box {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-top: 8px;
        }

        .photo-preview-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
            justify-content: center;
        }

        .photo-preview-grid img {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #3b82f6;
        }

        /* Daily Limit */
        #dailyLimitBox {
            background: #e3f2fd;
            border: 1px solid #90caf9;
            padding: 14px;
            margin: 20px 0;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            color: #0d47a1;
            line-height: 1.5;
        }

        #todayCount,
        #remainingCount {
            font-size: 19px;
        }

        #message {
            margin-top: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }

        /* Buttons */
        #basicNextButton,
        #submitSurvey {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #basicNextButton:disabled,
        #submitSurvey:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .question-navigation {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .question-navigation button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        #previousButton {
            background: #64748b;
        }

        #nextButton {
            background: #1565c0;
        }

        #questionNumber {
            margin-top: 10px;
            margin-bottom: 8px;
            font-weight: bold;
            color: #1565c0;
            font-size: 15px;
        }

        #questionText {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 16px;
        }
    </style>
</head>

<body>

    <div class="header">
        Surveykshan Survey Form
    </div>

    <div class="container">
        <div class="survey-box">

            <h2>Public Opinion Survey</h2>

            <!-- STEP 1: BASIC DETAILS + LOCATION + PHOTO -->
            <div id="basicDetailsStep">

                <label for="name">Name <span class="required">*</span></label>
                <input type="text" id="name" placeholder="Enter Name" autocomplete="off" required>

                <label for="mobile">Mobile <span class="required">*</span></label>
                <input type="tel" id="mobile" placeholder="Enter Mobile Number" inputmode="numeric" maxlength="10" autocomplete="off" required>

                <label for="age">Age <span class="required">*</span></label>
                <input type="number" id="age" placeholder="Enter Age" min="1" max="120" required>

                <label for="gender">Gender <span class="required">*</span></label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>

                <label for="village">Village <span class="required">*</span></label>
                <input type="text" id="village" placeholder="Enter Village" autocomplete="off" required>

                <label for="district">District <span class="required">*</span></label>
                <input type="text" id="district" placeholder="Enter District" autocomplete="off" required>

                <label for="pincode">PIN Code <span class="required">*</span></label>
                <input type="tel" id="pincode" placeholder="Enter 6 digit PIN Code" inputmode="numeric" maxlength="6" autocomplete="off" required>

                <!-- Location Section -->
                <div class="location-badge">
                    <span id="locationStatus">📍 लोकेशन प्राप्त की जा रही है...</span>
                    <button type="button" class="refresh-loc-btn" onclick="fetchLocation()">🔄 Refresh</button>
                </div>

                <!-- Photos Section -->
                <label>Survey Photos (Max 4 Photos) <span class="required">*</span></label>
                <div class="photo-upload-box">
                    <input type="file" id="surveyPhotos" accept="image/*" multiple style="min-height:auto; border:none; padding:0;">
                    <div id="photosPreviewGrid" class="photo-preview-grid"></div>
                </div>

                <!-- Daily Progress Box -->
                <div id="dailyLimitBox">
                    📊 Today's Surveys: <span id="todayCount">0</span>
                    <br>
                    Remaining: <span id="remainingCount">Loading...</span>
                </div>

                <div id="message"></div>

                <button id="basicNextButton" type="button">Next →</button>
            </div>

            <!-- STEP 2: QUESTIONS WIZARD -->
            <div id="questionStep" style="display: none;">

                <div id="questionNumber"></div>
                <div id="questionText">Loading questions...</div>
                <div id="questionOptions"></div>

                <div class="question-navigation">
                    <button id="previousButton" type="button">← Previous</button>
                    <button id="nextButton" type="button">Next →</button>
                </div>

                <button id="submitSurvey" type="button" style="display: none;">Submit Survey</button>
            </div>

        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Scripts -->
    <script src="firebase.js"></script>
    <script src="survey.js?v=105"></script>

</body>
</html>

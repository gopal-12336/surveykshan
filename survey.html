<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Surveykshan Survey</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            margin: 0;
            padding: 0;
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .header {
            background: #1565c0;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 20px auto;
            padding: 20px;
        }

        .survey-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,.15);
        }

        .survey-box h2 {
            text-align: center;
            color: #1565c0;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .required {
            color: red;
        }

        /* DAILY LIMIT */

        #dailyLimitBox {
            background: #e3f2fd;
            border: 1px solid #90caf9;
            padding: 14px;
            margin: 20px 0;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            color: #0d47a1;
        }

        #todayCount,
        #remainingCount {
            font-size: 18px;
        }

        /* SUBMIT BUTTON */

        #submitSurvey {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #submitSurvey:hover {
            background: #0d47a1;
        }

        #submitSurvey:disabled {
            background: #9e9e9e;
            cursor: not-allowed;
            opacity: 0.7;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .logout-btn {
            width: 100%;
            padding: 11px;
            margin-top: 10px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        @media (max-width: 768px) {

            .container {
                padding: 10px;
            }

            .survey-box {
                padding: 18px;
            }

            .header {
                font-size: 20px;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<div class="header">
    Surveykshan Survey Form
</div>


<!-- MAIN CONTAINER -->

<div class="container">

    <div class="survey-box">

        <h2>
            Public Opinion Survey
        </h2>


        <!-- NAME -->

        <label for="name">
            Name <span class="required">*</span>
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter Name"
        >


        <!-- MOBILE -->

        <label for="mobile">
            Mobile <span class="required">*</span>
        </label>

        <input
            type="tel"
            id="mobile"
            placeholder="Enter Mobile Number"
        >


        <!-- AGE -->

        <label for="age">
            Age <span class="required">*</span>
        </label>

        <input
            type="number"
            id="age"
            placeholder="Enter Age"
            min="1"
            max="120"
        >


        <!-- GENDER -->

        <label for="gender">
            Gender <span class="required">*</span>
        </label>

        <select id="gender">

            <option value="">
                Select Gender
            </option>

            <option value="Male">
                Male
            </option>

            <option value="Female">
                Female
            </option>

            <option value="Other">
                Other
            </option>

        </select>


        <!-- VILLAGE -->

        <label for="village">
            Village <span class="required">*</span>
        </label>

        <input
            type="text"
            id="village"
            placeholder="Enter Village"
        >


        <!-- ASSEMBLY -->

        <label for="assembly">
            Assembly <span class="required">*</span>
        </label>

        <input
            type="text"
            id="assembly"
            placeholder="Enter Assembly"
        >


        <!-- PARTY -->

        <label for="party">
            Party <span class="required">*</span>
        </label>

        <select id="party">

            <option value="">
                Select Party
            </option>

            <option value="BJP">
                BJP
            </option>

            <option value="Congress">
                Congress
            </option>

            <option value="AAP">
                AAP
            </option>

            <option value="BSP">
                BSP
            </option>

            <option value="SP">
                SP
            </option>

            <option value="Other">
                Other
            </option>

        </select>


        <!-- CANDIDATE -->

        <label for="candidate">
            Candidate
        </label>

        <input
            type="text"
            id="candidate"
            placeholder="Enter Candidate Name"
        >


        <!-- FEEDBACK -->

        <label for="feedback">
            Feedback
        </label>

        <textarea
            id="feedback"
            placeholder="Enter Feedback"
        ></textarea>


        <!-- DAILY LIMIT -->

        <div id="dailyLimitBox">

            Today's Surveys:
            <span id="todayCount">0</span>
            / 20

            <br>

            Remaining:
            <span id="remainingCount">20</span>

        </div>


        <!-- MESSAGE -->

        <div id="message"></div>


        <!-- SUBMIT -->

        <button
            id="submitSurvey"
            type="button"
        >
            Submit Survey
        </button>


    </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js">
</script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js">
</script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js">
</script>


<!-- FIREBASE CONFIG -->

<script src="firebase.js">
</script>


<!-- SURVEY JS -->

<script src="survey.js">
</script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surveykshan - Survey Form</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-box">

<h1>Surveykshan</h1>
<p>Political Survey Form</p>

<input type="text" id="name" placeholder="Full Name">

<input type="text" id="mobile" placeholder="Mobile Number">

<input type="number" id="age" placeholder="Age">

<select id="gender">
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<input type="text" id="village" placeholder="Village / City">

<input type="text" id="assembly" placeholder="Assembly Constituency">

<select id="party">
<option value="">Select Political Party</option>
<option>BJP</option>
<option>Congress</option>
<option>AAP</option>
<option>BSP</option>
<option>SP</option>
<option>Other</option>
</select>

<input type="text" id="candidate" placeholder="Candidate Name">

<textarea id="feedback" placeholder="Write Feedback" style="width:100%;height:100px;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:15px;"></textarea>

<button id="submitSurvey">Submit Survey</button>

<p id="message"></p>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>
<script src="survey.js"></script>

</body>
</html>

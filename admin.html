<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surveykshan Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">

    <!-- Excel Export Library -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        /* Original Blue Header */
        .admin-header {
            background: #1565c0;
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h1 {
            font-size: 22px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-logout {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Top Controls Bar */
        .controls-bar {
            max-width: 1350px;
            margin: 18px auto 10px auto;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .search-input {
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 320px;
            font-size: 14px;
            outline: none;
        }

        .bar-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-green-excel {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-blue-refresh {
            background: #1976d2;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-manage-q {
            background: #455a64;
            color: white;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        /* Original Blue Data Table */
        .table-container {
            max-width: 1350px;
            margin: 10px auto 30px auto;
            padding: 0 15px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-radius: 6px;
            overflow: hidden;
            font-size: 14px;
        }

        thead tr {
            background: #1976d2;
            color: white;
            text-align: left;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid #e0e0e0;
            vertical-align: middle;
        }

        tbody tr:hover {
            background: #f5f9ff;
        }

        /* Specific Table Buttons */
        .btn-photo-pill {
            background: #1976d2;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
        }

        .badge-map {
            background: #00897b;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            margin-left: 6px;
        }

        .btn-action-answers {
            background: #6a1b9a;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .btn-action-edit {
            background: #0288d1;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            margin-left: 4px;
        }

        .btn-action-del {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            margin-left: 4px;
        }

        /* Modals */
        .modal-wrap {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 15px;
        }

        .modal-box {
            background: white;
            width: 100%;
            max-width: 650px;
            border-radius: 8px;
            padding: 20px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .modal-close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .photo-grid-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
        }

        .photo-grid-box img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <header class="admin-header">
        <h1>Surveykshan Admin Panel</h1>
        <div class="header-actions">
            <span id="userEmailSpan">goswamivinod2305@gmail.com</span>
            <button class="btn-logout" onclick="logoutAdmin()">Logout</button>
        </div>
    </header>

    <div class="controls-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Search by name, mobile, village..." onkeyup="filterTable()">
        <div class="bar-buttons">
            <button id="btnExcel" class="btn-green-excel" onclick="exportExcel()">📥 Export to Excel</button>
            <button class="btn-blue-refresh" onclick="loadSurveysData()">🔄 Refresh</button>
            <a href="questions.html" class="btn-manage-q">Manage Questions</a>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Photo</th>
                    <th>Name</th>
                    <th>Mobile</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Village</th>
                    <th>Location</th>
                    <th>Surveyor Details</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="surveyTbody">
                <tr>
                    <td colspan="9" style="text-align:center; padding: 25px; color:#777;">डेटा लोड हो रहा है...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Photos Modal -->
    <div id="photosModal" class="modal-wrap">
        <div class="modal-box">
            <div class="modal-head">
                <h3 id="photoModalTitle">Survey Photos</h3>
                <button class="modal-close-btn" onclick="closeModal('photosModal')">&times;</button>
            </div>
            <div id="photosContainer" class="photo-grid-box"></div>
        </div>
    </div>

    <!-- Answers Modal -->
    <div id="answersModal" class="modal-wrap">
        <div class="modal-box">
            <div class="modal-head">
                <h3 id="answersModalTitle">Survey Answers</h3>
                <button class="modal-close-btn" onclick="closeModal('answersModal')">&times;</button>
            </div>
            <div id="answersContainer" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- App Scripts -->
    <script src="firebase.js"></script>
    <script src="admin.js?v=601"></script>
</body>
</html>

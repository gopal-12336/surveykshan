आपकी समस्या की असली जड़ मिल गई है:

`admin.html` के सबसे नीचे एक पुराना `<script>` टैग लगा हुआ था, जिसमें `MutationObserver` चल रहा था। वह स्क्रिप्ट `admin.js` द्वारा रेंडर की गई टेबल के आगे फिर से एक नया `Photo` सेल (`row.insertBefore(photoCell, row.firstElementChild)`) जबरन ठूंस रहा था और साथ ही `Party/Candidate` कॉलम हटाने की कोशिश में टेबल का सारा अलाइनमेंट बिगाड़ रहा था। इसी वजह से `Actions` और `Surveyor Details` खिसककर बाहर चले जा रहे थे और खाली `No Photo` दिख रहा था।

नीचे आपकी **`admin.html`** का पूरा, सही और साफ़ कोड दिया गया है। इसमें:

1. टेबल हेडर को 9 कॉलम्स (`Photo`, `Name`, `Mobile`, `Age`, `Gender`, `Village`, `Location`, `Surveyor Details`, `Actions`) के साथ व्यवस्थित कर दिया गया है।
2. 4-फ़ोटो देखने के लिए आवश्यक ग्रिड मोडल (`#photosModal`) जोड़ दिया गया है।
3. नीचे का वह पुराना टकराने वाला स्क्रिप्ट हटा दिया गया है, ताकि सारा काम आपकी नई `admin.js` से सटीक और साफ़ चले।

आप अपनी मौजूदा `admin.html` की सारी कोडिंग हटाकर यह पूरा कोड पेस्ट कर दें:

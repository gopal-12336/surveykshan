<!-- DAILY SURVEY LIMIT -->

<div class="section-title">

    <h2>⚙️ Daily Survey Limit</h2>

    <div style="padding:15px;">

        <input
            type="number"
            id="dailyLimitInput"
            min="1"
            value="20"
            placeholder="Daily Limit"
            style="
                padding:10px;
                width:180px;
                border:1px solid #ccc;
                border-radius:5px;
            "
        >

        <button
            id="saveDailyLimit"
            style="
                background:#1565c0;
                color:white;
            "
        >
            💾 Save Limit
        </button>

        <span
            id="limitMessage"
            style="margin-left:10px;font-weight:bold;">
        </span>

    </div>

</div>

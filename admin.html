<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Surveykshan Admin Panel</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            background: #f4f6f9;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .header {
            background: #1565c0;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(180px, 1fr)
            );
            gap: 15px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 10px rgba(0,0,0,.15);
        }

        .card h4 {
            margin: 0 0 10px;
        }

        .card h2 {
            color: #1565c0;
            font-size: 30px;
            margin: 0;
        }

        .container {
            padding: 20px;
        }

        /* FILTER AREA */

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }

        #searchBox {
            flex: 1;
            min-width: 250px;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        #partyFilter,
        #dateFilter {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            min-width: 150px;
            background: white;
        }

        #resetFilters {
            padding: 11px 16px;
            border: none;
            border-radius: 6px;
            background: #555;
            color: white;
            cursor: pointer;
        }

        #resetFilters:hover {
            background: #333;
        }

        /* BUTTONS */

        button {
            margin: 5px;
            padding: 9px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #exportExcel {
            background: #198754;
            color: white;
        }

        #logoutBtn {
            background: #dc3545;
            color: white;
        }

        /* CHART */

        .chart-container {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.10);
        }

        #partyChart {
            max-width: 700px;
            margin: auto;
            display: block;
        }

        /* TABLE */

        .table-container {
            width: 100%;
            overflow-x: auto;
            background: white;
            border-radius: 10px;
        }

        table {
            width: 100%;
            min-width: 900px;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #1565c0;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8f9fa;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .header {
                font-size: 20px;
            }

            .container {
                padding: 10px;
            }

            .dashboard {
                padding: 10px;
            }

            .filter-row {
                flex-direction: column;
                align-items: stretch;
            }

            #searchBox,
            #partyFilter,
            #dateFilter,
            #resetFilters {
                width: 100%;
                box-sizing: border-box;
            }

        }

    </style>

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<div class="header">

    Surveykshan Admin Dashboard

</div>


<!-- ==========================================
     DASHBOARD CARDS
========================================== -->

<div class="dashboard">


    <div class="card">

        <h4>Total Surveys</h4>

        <h2 id="totalSurvey">0</h2>

    </div>


    <div class="card">

        <h4>BJP</h4>

        <h2 id="bjpCount">0</h2>

    </div>


    <div class="card">

        <h4>Congress</h4>

        <h2 id="congressCount">0</h2>

    </div>


    <div class="card">

        <h4>AAP</h4>

        <h2 id="aapCount">0</h2>

    </div>


    <div class="card">

        <h4>BSP</h4>

        <h2 id="bspCount">0</h2>

    </div>


    <div class="card">

        <h4>SP</h4>

        <h2 id="spCount">0</h2>

    </div>


    <div class="card">

        <h4>Others</h4>

        <h2 id="otherCount">0</h2>

    </div>


</div>


<!-- ==========================================
     MAIN CONTAINER
========================================== -->

<div class="container">


    <!-- ======================================
         FILTERS
    ======================================= -->

    <div class="filter-row">


        <input
            type="text"
            id="searchBox"
            placeholder="Search Name, Mobile, Village or Assembly">


        <select id="partyFilter">

            <option value="">
                All Parties
            </option>

            <option value="BJP">
                BJP
            </option>

            <option value="Congress">
                Congress
            </option>

            <option value="AAP">
                AAP
            </option>

            <option value="BSP">
                BSP
            </option>

            <option value="SP">
                SP
            </option>

            <option value="Other">
                Other
            </option>

        </select>


        <select id="dateFilter">

            <option value="">
                All Dates
            </option>

            <option value="today">
                Today
            </option>

            <option value="week">
                This Week
            </option>

            <option value="month">
                This Month
            </option>

        </select>


        <button id="resetFilters">

            🔄 Reset

        </button>


    </div>


    <!-- ======================================
         ACTION BUTTONS
    ======================================= -->

    <div>

        <button id="exportExcel">

            📥 Export Excel

        </button>


        <button id="logoutBtn">

            Logout

        </button>

    </div>


    <!-- ======================================
         CHART
    ======================================= -->

    <div class="chart-container">

        <canvas id="partyChart"></canvas>

    </div>


    <!-- ======================================
         SURVEY TABLE
    ======================================= -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Name</th>

                    <th>Mobile</th>

                    <th>Age</th>

                    <th>Gender</th>

                    <th>Village</th>

                    <th>Party</th>

                    <th>Candidate</th>

                    <th>Feedback</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="surveyTable">

            </tbody>

        </table>

    </div>


</div>


<!-- ==========================================
     FIREBASE
========================================== -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js">
</script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js">
</script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js">
</script>


<script src="firebase.js"></script>


<!-- ==========================================
     EXCEL
========================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
</script>


<!-- ==========================================
     CHART.JS
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/chart.js">
</script>


<!-- ==========================================
     ADMIN JS
========================================== -->

<script src="admin.js"></script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Surveykshan - Question Manager</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================
   PAGE
========================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    background:#f4f6f9;
    font-family:Arial,sans-serif;
    color:#222;
}

.container{
    width:100%;
    max-width:900px;
    margin:25px auto;
    padding:15px;
}

.box{
    background:#fff;
    padding:22px;
    margin-bottom:20px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,0.10);
}

h1{
    margin:0;
    color:#1565c0;
    font-size:28px;
}

h2{
    color:#1565c0;
    margin-top:8px;
}

h3{
    margin-bottom:10px;
}

/* =========================
   NORMAL INPUTS
========================= */

#questionText,
#questionType{
    display:block;
    width:100%;
    height:48px;
    padding:10px 12px;
    margin:7px 0 15px;
    border:1px solid #bbb;
    border-radius:7px;
    background:#fff;
    color:#222;
    font-size:16px;
}

/* =========================
   OPTIONS
========================= */

#optionsSection{
    width:100%;
}

#optionsBox{
    width:100%;
}

.option-row{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

/* IMPORTANT:
   Only the option text input gets flex:1
*/

.option-text{
    flex:1 !important;
    width:auto !important;
    min-width:0;
    height:46px !important;
    padding:10px 14px !important;
    margin:0 !important;

    border:2px solid #ccc !important;
    border-radius:7px !important;

    background:#fff !important;
    color:#111 !important;

    font-size:16px !important;
    outline:none;
}

.option-text:focus{
    border-color:#1565c0 !important;
    box-shadow:0 0 4px rgba(21,101,192,.25);
}

/* DELETE BUTTON */

.remove-option{
    flex:0 0 45px !important;
    width:45px !important;
    min-width:45px !important;
    max-width:45px !important;

    height:45px !important;

    margin:0 !important;
    padding:0 !important;

    border:none !important;
    border-radius:7px !important;

    background:#d32f2f !important;
    color:#fff !important;

    font-size:24px !important;
    font-weight:bold;

    cursor:pointer;
}

.remove-option:hover{
    background:#b71c1c !important;
}

/* =========================
   BUTTONS
========================= */

button{
    cursor:pointer;
    font-family:Arial,sans-serif;
}

.add{
    width:100%;
    background:#757575;
    color:white;
    border:none;
    padding:13px;
    border-radius:7px;
    font-size:16px;
    margin-top:5px;
}

.add:hover{
    background:#616161;
}

.save{
    width:100%;
    background:#2e7d32;
    color:white;
    border:none;
    padding:13px;
    border-radius:7px;
    font-size:16px;
    margin-top:10px;
}

.save:hover{
    background:#1b5e20;
}

.back{
    width:100%;
    background:#555;
    color:white;
    border:none;
    padding:12px;
    border-radius:7px;
    font-size:15px;
    margin-top:8px;
}

/* =========================
   INFO
========================= */

.type-info{
    background:#e3f2fd;
    color:#1565c0;
    padding:12px;
    border-radius:7px;
    margin:5px 0 15px;
    font-size:14px;
}

/* =========================
   QUESTION CARDS
========================= */

.question-card{
    background:#fafafa;
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;
    margin-top:15px;
}

.question-card button{
    padding:9px 14px;
    border:none;
    border-radius:6px;
    color:white;
    margin-top:8px;
}

.edit{
    background:#ef6c00;
}

.delete{
    background:#c62828;
}

/* =========================
   MESSAGE
========================= */

#message{
    text-align:center;
    font-weight:bold;
    margin-top:15px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .container{
        padding:8px;
        margin:10px auto;
    }

    .box{
        padding:15px;
    }

    h1{
        font-size:24px;
    }

    .option-row{
        gap:7px;
    }

    .option-text{
        height:44px !important;
        font-size:15px !important;
    }

    .remove-option{
        flex-basis:42px !important;
        width:42px !important;
        min-width:42px !important;
        max-width:42px !important;
        height:42px !important;
    }
}

</style>

</head>

<body>

<div class="container">

<!-- =========================
     QUESTION CREATOR
========================= -->

<div class="box">

<h1>📝 Survey Question Manager</h1>

<p>
यहाँ से आप अपने survey के questions बना सकते हैं।
</p>

<label>
<strong>Question</strong>
</label>

<input
    type="text"
    id="questionText"
    placeholder="Enter your question">


<label>
<strong>Question Type</strong>
</label>

<select id="questionType">

<option value="radio">
Single Choice — Select One
</option>

<option value="checkbox">
Multiple Choice — Select Multiple
</option>

<option value="text">
Text Answer
</option>

</select>


<div
    class="type-info"
    id="typeInfo">

Single Choice: Respondent can select only one option.

</div>


<!-- =========================
     OPTIONS
========================= -->

<div id="optionsSection">

<h3>Options</h3>

<div id="optionsBox">

<div class="option-row">

<input
    type="text"
    class="option-text"
    placeholder="Enter Option 1">

<button
    type="button"
    class="remove-option"
    onclick="removeOption(this)">
×
</button>

</div>


<div class="option-row">

<input
    type="text"
    class="option-text"
    placeholder="Enter Option 2">

<button
    type="button"
    class="remove-option"
    onclick="removeOption(this)">
×
</button>

</div>

</div>


<button
    type="button"
    class="add"
    onclick="addOption()">

＋ Add Option

</button>

</div>


<button
    type="button"
    class="save"
    id="saveQuestion">

💾 Save Question

</button>


<button
    type="button"
    class="back"
    onclick="window.location.href='admin.html'">

← Admin Dashboard

</button>


<p id="message"></p>

</div>


<!-- =========================
     EXISTING QUESTIONS
========================= -->

<div class="box">

<h2>📋 Survey Questions</h2>

<div id="questionsList">
Loading questions...
</div>

</div>

</div>


<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>


<script>

/* =========================
   ADMIN
========================= */

const ADMIN_EMAIL =
"goswamivinod2305@gmail.com";

let editingId = null;


/* =========================
   AUTH
========================= */

firebase.auth().onAuthStateChanged(function(user){

    if(!user){

        window.location.href="index.html";

        return;
    }

    if(
        !user.email ||
        user.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ){

        window.location.href="survey.html";

        return;
    }

    loadQuestions();

});


/* =========================
   QUESTION TYPE
========================= */

document
.getElementById("questionType")
.addEventListener("change",function(){

    const type=this.value;

    const optionsSection=
        document.getElementById("optionsSection");

    const typeInfo=
        document.getElementById("typeInfo");


    if(type==="radio"){

        optionsSection.style.display="block";

        typeInfo.textContent=
        "Single Choice: Respondent can select only one option.";

    }

    else if(type==="checkbox"){

        optionsSection.style.display="block";

        typeInfo.textContent=
        "Multiple Choice: Respondent can select multiple options.";

    }

    else{

        optionsSection.style.display="none";

        typeInfo.textContent=
        "Text Answer: Respondent will type their answer.";

    }

});


/* =========================
   ADD OPTION
========================= */

function addOption(){

    const box=
        document.getElementById("optionsBox");

    const count=
        box.querySelectorAll(".option-text").length + 1;

    const row=
        document.createElement("div");

    row.className="option-row";

    row.innerHTML=`

        <input
            type="text"
            class="option-text"
            placeholder="Enter Option ${count}">

        <button
            type="button"
            class="remove-option"
            onclick="removeOption(this)">
            ×
        </button>

    `;

    box.appendChild(row);

}


/* =========================
   REMOVE OPTION
========================= */

function removeOption(button){

    const box=
        document.getElementById("optionsBox");

    const rows=
        box.querySelectorAll(".option-row");

    if(rows.length<=2){

        showMessage(
            "At least 2 options are required.",
            false
        );

        return;
    }

    button.parentElement.remove();

}


/* =========================
   SAVE QUESTION
========================= */

document
.getElementById("saveQuestion")
.addEventListener("click",function(){

    const question=
        document
        .getElementById("questionText")
        .value
        .trim();

    const type=
        document
        .getElementById("questionType")
        .value;


    if(!question){

        showMessage(
            "Please enter a question.",
            false
        );

        return;
    }


    let options=[];


    if(
        type==="radio" ||
        type==="checkbox"
    ){

        document
        .querySelectorAll(".option-text")
        .forEach(function(input){

            const value=
                input.value.trim();

            if(value){

                options.push(value);

            }

        });


        if(options.length<2){

            showMessage(
                "Please enter at least 2 options.",
                false
            );

            return;
        }

    }


    const data={

        question:question,

        type:type,

        options:options,

        updatedAt:
            firebase.firestore
            .FieldValue
            .serverTimestamp()

    };


    let operation;


    if(editingId){

        operation=
            db.collection("questions")
            .doc(editingId)
            .update(data);

    }

    else{

        operation=
            db.collection("questions")
            .add({

                ...data,

                createdAt:
                    firebase.firestore
                    .FieldValue
                    .serverTimestamp()

            });

    }


    operation

    .then(function(){

        showMessage(
            editingId
            ? "✅ Question updated successfully."
            : "✅ Question saved successfully.",
            true
        );


        editingId=null;


        document
        .getElementById("questionText")
        .value="";


        document
        .getElementById("questionType")
        .value="radio";


        document
        .getElementById("typeInfo")
        .textContent=
        "Single Choice: Respondent can select only one option.";


        document
        .getElementById("optionsSection")
        .style.display="block";


        resetOptions();


        document
        .getElementById("saveQuestion")
        .textContent=
        "💾 Save Question";


        loadQuestions();

    })

    .catch(function(error){

        console.error(
            "Question Save Error:",
            error
        );

        showMessage(
            "❌ "+error.message,
            false
        );

    });

});


/* =========================
   LOAD QUESTIONS
========================= */

function loadQuestions(){

    db.collection("questions")
    .get()

    .then(function(snapshot){

        const list=
            document.getElementById("questionsList");

        list.innerHTML="";


        if(snapshot.empty){

            list.innerHTML=
            "<p>No questions added yet.</p>";

            return;
        }


        snapshot.forEach(function(doc){

            const data=doc.data();

            const card=
                document.createElement("div");

            card.className="question-card";


            let typeName="";

            if(data.type==="radio"){

                typeName="Single Choice";

            }

            else if(data.type==="checkbox"){

                typeName="Multiple Choice";

            }

            else{

                typeName="Text Answer";

            }


            let optionsHTML="";


            if(
                data.options &&
                data.options.length
            ){

                optionsHTML=
                "<strong>Options:</strong><ol>"+

                data.options
                .map(function(option){

                    return "<li>"+
                    escapeHTML(option)+
                    "</li>";

                })
                .join("")+

                "</ol>";

            }


            card.innerHTML=`

                <strong>Question:</strong>

                ${escapeHTML(data.question)}

                <br><br>

                <strong>Type:</strong>

                ${typeName}

                <br><br>

                ${optionsHTML}

                <button class="edit">
                    ✏️ Edit
                </button>

                <button class="delete">
                    🗑️ Delete
                </button>

            `;


            card
            .querySelector(".edit")
            .onclick=function(){

                editQuestion(
                    doc.id,
                    data
                );

            };


            card
            .querySelector(".delete")
            .onclick=function(){

                deleteQuestion(
                    doc.id
                );

            };


            list.appendChild(card);

        });

    })

    .catch(function(error){

        console.error(
            "Question Load Error:",
            error
        );

        document
        .getElementById("questionsList")
        .textContent=
        "Unable to load questions: "+
        error.message;

    });

}


/* =========================
   EDIT QUESTION
========================= */

function editQuestion(id,data){

    editingId=id;


    document
    .getElementById("questionText")
    .value=
        data.question || "";


    document
    .getElementById("questionType")
    .value=
        data.type || "radio";


    const box=
        document.getElementById("optionsBox");

    box.innerHTML="";


    if(
        data.type==="radio" ||
        data.type==="checkbox"
    ){

        document
        .getElementById("optionsSection")
        .style.display="block";


        document
        .getElementById("typeInfo")
        .textContent=
        data.type==="radio"
        ? "Single Choice: Respondent can select only one option."
        : "Multiple Choice: Respondent can select multiple options.";


        (data.options || [])
        .forEach(function(option,index){

            const row=
                document.createElement("div");

            row.className="option-row";


            row.innerHTML=`

                <input
                    type="text"
                    class="option-text"
                    value="${escapeHTML(option)}"
                    placeholder="Enter Option ${index+1}">

                <button
                    type="button"
                    class="remove-option"
                    onclick="removeOption(this)">
                    ×
                </button>

            `;


            box.appendChild(row);

        });

    }

    else{

        document
        .getElementById("optionsSection")
        .style.display="none";

    }


    document
    .getElementById("saveQuestion")
    .textContent=
    "💾 Update Question";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================
   DELETE QUESTION
========================= */

function deleteQuestion(id){

    if(
        !confirm(
            "Are you sure you want to delete this question?"
        )
    ){

        return;
    }


    db.collection("questions")
    .doc(id)
    .delete()

    .then(function(){

        showMessage(
            "✅ Question deleted.",
            true
        );

        loadQuestions();

    })

    .catch(function(error){

        showMessage(
            "❌ Delete failed: "+
            error.message,
            false
        );

    });

}


/* =========================
   RESET OPTIONS
========================= */

function resetOptions(){

    const box=
        document.getElementById("optionsBox");


    box.innerHTML=`

        <div class="option-row">

            <input
                type="text"
                class="option-text"
                placeholder="Enter Option 1">

            <button
                type="button"
                class="remove-option"
                onclick="removeOption(this)">
                ×
            </button>

        </div>


        <div class="option-row">

            <input
                type="text"
                class="option-text"
                placeholder="Enter Option 2">

            <button
                type="button"
                class="remove-option"
                onclick="removeOption(this)">
                ×
            </button>

        </div>

    `;

}


/* =========================
   MESSAGE
========================= */

function showMessage(text,success){

    const message=
        document.getElementById("message");

    message.textContent=text;

    message.style.color=
        success
        ? "green"
        : "red";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(value || "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Surveykshan - Question Manager</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
}

body {
    background: #f4f6f9;
    font-family: Arial, Helvetica, sans-serif;
    color: #222;
}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.qm-container {
    width: 100%;
    max-width: 900px;
    margin: 25px auto;
    padding: 15px;
}


/* =====================================================
   BOX
===================================================== */

.qm-box {
    width: 100%;
    background: #ffffff;
    padding: 22px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.10);
}


/* =====================================================
   HEADINGS
===================================================== */

.qm-title {
    margin: 0 0 8px 0;
    color: #1565c0;
    font-size: 28px;
}

.qm-subtitle {
    margin: 0 0 20px 0;
    color: #666;
    font-size: 14px;
}

.qm-heading {
    color: #1565c0;
    margin: 0 0 15px 0;
}


/* =====================================================
   LABEL
===================================================== */

.qm-label {
    display: block;
    margin-top: 12px;
    margin-bottom: 5px;
    font-weight: bold;
}


/* =====================================================
   QUESTION INPUT
===================================================== */

#questionText {
    display: block;
    width: 100%;
    height: 48px;
    padding: 10px 12px;
    margin: 0 0 15px 0;

    border: 1px solid #bbb;
    border-radius: 7px;

    background: #fff;
    color: #222;

    font-size: 16px;
    outline: none;
}

#questionText:focus {
    border-color: #1565c0;
}


/* =====================================================
   QUESTION TYPE
===================================================== */

#questionType {
    display: block;
    width: 100%;
    height: 48px;
    padding: 10px 12px;
    margin: 0 0 15px 0;

    border: 1px solid #bbb;
    border-radius: 7px;

    background: #fff;
    color: #222;

    font-size: 16px;
}


/* =====================================================
   TYPE INFO
===================================================== */

#typeInfo {
    width: 100%;
    background: #e3f2fd;
    color: #1565c0;
    padding: 12px;
    border-radius: 7px;
    margin: 5px 0 18px 0;
    font-size: 14px;
}


/* =====================================================
   OPTIONS SECTION
===================================================== */

#optionsSection {
    width: 100%;
    display: block;
}

#optionsSection h3 {
    margin: 0 0 12px 0;
}


/* =====================================================
   OPTIONS BOX
===================================================== */

#optionsBox {
    width: 100%;
    display: block;
}


/* =====================================================
   OPTION ROW
===================================================== */

.option-row {
    width: 100% !important;

    display: flex !important;

    flex-direction: row !important;

    align-items: center !important;

    gap: 10px !important;

    margin: 0 0 10px 0 !important;

    padding: 0 !important;

    background: transparent !important;
}


/* =====================================================
   OPTION INPUT
===================================================== */

.option-row .option-text {
    display: block !important;

    flex: 1 1 auto !important;

    width: auto !important;

    min-width: 0 !important;

    max-width: none !important;

    height: 46px !important;

    margin: 0 !important;

    padding: 10px 14px !important;

    border: 2px solid #cccccc !important;

    border-radius: 7px !important;

    background: #ffffff !important;

    color: #111111 !important;

    font-family: Arial, Helvetica, sans-serif !important;

    font-size: 16px !important;

    outline: none !important;
}

.option-row .option-text:focus {
    border-color: #1565c0 !important;

    box-shadow:
        0 0 5px rgba(21,101,192,0.25) !important;
}


/* =====================================================
   REMOVE OPTION BUTTON
===================================================== */

.option-row .remove-option {
    display: flex !important;

    flex: 0 0 45px !important;

    width: 45px !important;

    min-width: 45px !important;

    max-width: 45px !important;

    height: 45px !important;

    min-height: 45px !important;

    max-height: 45px !important;

    margin: 0 !important;

    padding: 0 !important;

    align-items: center !important;

    justify-content: center !important;

    border: none !important;

    border-radius: 7px !important;

    background: #d32f2f !important;

    color: #ffffff !important;

    font-family: Arial, Helvetica, sans-serif !important;

    font-size: 23px !important;

    font-weight: bold !important;

    line-height: 1 !important;

    cursor: pointer !important;

    box-shadow: none !important;
}

.option-row .remove-option:hover {
    background: #b71c1c !important;
}


/* =====================================================
   ADD OPTION BUTTON
===================================================== */

.qm-add {
    display: block !important;

    width: 100% !important;

    height: 46px !important;

    margin: 5px 0 0 0 !important;

    padding: 10px !important;

    border: none !important;

    border-radius: 7px !important;

    background: #757575 !important;

    color: white !important;

    font-size: 16px !important;

    cursor: pointer !important;
}

.qm-add:hover {
    background: #616161 !important;
}


/* =====================================================
   SAVE BUTTON
===================================================== */

.qm-save {
    display: block !important;

    width: 100% !important;

    height: 48px !important;

    margin: 15px 0 0 0 !important;

    padding: 10px !important;

    border: none !important;

    border-radius: 7px !important;

    background: #2e7d32 !important;

    color: white !important;

    font-size: 16px !important;

    cursor: pointer !important;
}

.qm-save:hover {
    background: #1b5e20 !important;
}


/* =====================================================
   BACK BUTTON
===================================================== */

.qm-back {
    display: block !important;

    width: 100% !important;

    height: 45px !important;

    margin: 8px 0 0 0 !important;

    padding: 10px !important;

    border: none !important;

    border-radius: 7px !important;

    background: #555555 !important;

    color: white !important;

    font-size: 15px !important;

    cursor: pointer !important;
}

.qm-back:hover {
    background: #333333 !important;
}


/* =====================================================
   MESSAGE
===================================================== */

#message {
    text-align: center;
    font-weight: bold;
    margin: 15px 0 0 0;
}


/* =====================================================
   QUESTION CARD
===================================================== */

.question-card {
    width: 100%;

    background: #fafafa;

    border: 1px solid #ddd;

    border-radius: 8px;

    padding: 15px;

    margin-top: 15px;
}

.question-card strong {
    color: #333;
}

.question-card ol {
    margin-top: 8px;
    padding-left: 25px;
}

.question-card li {
    margin-bottom: 5px;
}


/* =====================================================
   EDIT / DELETE
===================================================== */

.qm-edit {
    display: inline-block !important;

    width: auto !important;

    min-width: 90px !important;

    height: 40px !important;

    margin: 8px 5px 0 0 !important;

    padding: 8px 14px !important;

    border: none !important;

    border-radius: 6px !important;

    background: #ef6c00 !important;

    color: white !important;

    cursor: pointer !important;
}

.qm-delete {
    display: inline-block !important;

    width: auto !important;

    min-width: 90px !important;

    height: 40px !important;

    margin: 8px 0 0 0 !important;

    padding: 8px 14px !important;

    border: none !important;

    border-radius: 6px !important;

    background: #c62828 !important;

    color: white !important;

    cursor: pointer !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .qm-container {
        width: 100%;
        padding: 8px;
        margin: 10px auto;
    }

    .qm-box {
        padding: 15px;
    }

    .qm-title {
        font-size: 24px;
    }

    .option-row {
        gap: 7px !important;
    }

    .option-row .option-text {
        height: 44px !important;
        font-size: 15px !important;
    }

    .option-row .remove-option {
        flex: 0 0 42px !important;

        width: 42px !important;

        min-width: 42px !important;

        max-width: 42px !important;

        height: 42px !important;

        min-height: 42px !important;

        max-height: 42px !important;
    }

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media (max-width: 380px) {

    .qm-box {
        padding: 12px;
    }

    .option-row {
        gap: 5px !important;
    }

    .option-row .remove-option {
        flex-basis: 40px !important;
        width: 40px !important;
        min-width: 40px !important;
        max-width: 40px !important;

        height: 40px !important;
        min-height: 40px !important;
        max-height: 40px !important;
    }

}

</style>

</head>


<body>


<div class="qm-container">


<!-- =====================================================
     QUESTION CREATOR
===================================================== -->

<div class="qm-box">

    <h1 class="qm-title">
        📝 Survey Question Manager
    </h1>

    <p class="qm-subtitle">
        यहाँ से आप अपने survey के questions बना सकते हैं।
    </p>


    <!-- QUESTION -->

    <label class="qm-label">
        Question
    </label>

    <input
        type="text"
        id="questionText"
        placeholder="Enter your question">


    <!-- QUESTION TYPE -->

    <label class="qm-label">
        Question Type
    </label>

    <select id="questionType">

        <option value="radio">
            Single Choice — Select One
        </option>

        <option value="checkbox">
            Multiple Choice — Select Multiple
        </option>

        <option value="text">
            Text Answer
        </option>

    </select>


    <!-- INFO -->

    <div id="typeInfo">

        Single Choice:
        Respondent can select only one option.

    </div>


    <!-- OPTIONS -->

    <div id="optionsSection">

        <h3>
            Answer Options
        </h3>


        <div id="optionsBox">


            <!-- OPTION 1 -->

            <div class="option-row">

                <input
                    type="text"
                    class="option-text"
                    placeholder="Enter Option 1">

                <button
                    type="button"
                    class="remove-option"
                    onclick="removeOption(this)">
                    ×
                </button>

            </div>


            <!-- OPTION 2 -->

            <div class="option-row">

                <input
                    type="text"
                    class="option-text"
                    placeholder="Enter Option 2">

                <button
                    type="button"
                    class="remove-option"
                    onclick="removeOption(this)">
                    ×
                </button>

            </div>


        </div>


        <button
            type="button"
            class="qm-add"
            onclick="addOption()">

            ＋ Add Option

        </button>

    </div>


    <!-- SAVE -->

    <button
        type="button"
        class="qm-save"
        id="saveQuestion">

        💾 Save Question

    </button>


    <!-- BACK -->

    <button
        type="button"
        class="qm-back"
        onclick="window.location.href='admin.html'">

        ← Admin Dashboard

    </button>


    <p id="message"></p>

</div>


<!-- =====================================================
     EXISTING QUESTIONS
===================================================== -->

<div class="qm-box">

    <h2 class="qm-heading">
        📋 Survey Questions
    </h2>

    <div id="questionsList">
        Loading questions...
    </div>

</div>


</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>


<script>

/* =====================================================
   ADMIN
===================================================== */

const ADMIN_EMAIL =
    "goswamivinod2305@gmail.com";

let editingId = null;


/* =====================================================
   AUTH
===================================================== */

firebase.auth().onAuthStateChanged(function(user) {

    if (!user) {

        window.location.href = "index.html";

        return;

    }


    if (
        !user.email ||
        user.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ) {

        window.location.href = "survey.html";

        return;

    }


    loadQuestions();

});


/* =====================================================
   QUESTION TYPE
===================================================== */

document
    .getElementById("questionType")
    .addEventListener("change", function() {

        const type = this.value;

        const optionsSection =
            document.getElementById(
                "optionsSection"
            );

        const typeInfo =
            document.getElementById(
                "typeInfo"
            );


        if (type === "radio") {

            optionsSection.style.display =
                "block";

            typeInfo.textContent =
                "Single Choice: Respondent can select only one option.";

        }


        else if (type === "checkbox") {

            optionsSection.style.display =
                "block";

            typeInfo.textContent =
                "Multiple Choice: Respondent can select multiple options.";

        }


        else {

            optionsSection.style.display =
                "none";

            typeInfo.textContent =
                "Text Answer: Respondent will type their answer.";

        }

    });


/* =====================================================
   ADD OPTION
===================================================== */

function addOption() {

    const box =
        document.getElementById(
            "optionsBox"
        );


    const count =
        box.querySelectorAll(
            ".option-text"
        ).length + 1;


    const row =
        document.createElement("div");


    row.className =
        "option-row";


    row.innerHTML = `

        <input
            type="text"
            class="option-text"
            placeholder="Enter Option ${count}">

        <button
            type="button"
            class="remove-option">

            ×

        </button>

    `;


    row
        .querySelector(".remove-option")
        .addEventListener(
            "click",
            function() {

                removeOption(this);

            }
        );


    box.appendChild(row);

}


/* =====================================================
   REMOVE OPTION
===================================================== */

function removeOption(button) {

    const box =
        document.getElementById(
            "optionsBox"
        );


    const rows =
        box.querySelectorAll(
            ".option-row"
        );


    if (rows.length <= 2) {

        showMessage(
            "At least 2 options are required.",
            false
        );

        return;

    }


    button
        .closest(".option-row")
        .remove();

}


/* =====================================================
   SAVE QUESTION
===================================================== */

document
    .getElementById("saveQuestion")
    .addEventListener("click", function() {

        const question =
            document
                .getElementById("questionText")
                .value
                .trim();


        const type =
            document
                .getElementById("questionType")
                .value;


        if (!question) {

            showMessage(
                "Please enter a question.",
                false
            );

            return;

        }


        let options = [];


        if (
            type === "radio" ||
            type === "checkbox"
        ) {

            document
                .querySelectorAll(
                    "#optionsBox .option-text"
                )
                .forEach(function(input) {

                    const value =
                        input.value.trim();


                    if (value) {

                        options.push(value);

                    }

                });


            if (options.length < 2) {

                showMessage(
                    "Please enter at least 2 options.",
                    false
                );

                return;

            }

        }


        const data = {

            question:
                question,

            type:
                type,

            options:
                options,

            updatedAt:
                firebase.firestore
                    .FieldValue
                    .serverTimestamp()

        };


        let operation;


        if (editingId) {

            operation =
                db.collection("questions")
                    .doc(editingId)
                    .update(data);

        }

        else {

            operation =
                db.collection("questions")
                    .add({

                        ...data,

                        createdAt:
                            firebase.firestore
                                .FieldValue
                                .serverTimestamp()

                    });

        }


        operation

            .then(function() {

                showMessage(

                    editingId
                        ? "✅ Question updated successfully."
                        : "✅ Question saved successfully.",

                    true

                );


                editingId = null;


                document
                    .getElementById("questionText")
                    .value = "";


                document
                    .getElementById("questionType")
                    .value = "radio";


                document
                    .getElementById("typeInfo")
                    .textContent =
                    "Single Choice: Respondent can select only one option.";


                document
                    .getElementById("optionsSection")
                    .style.display =
                    "block";


                resetOptions();


                document
                    .getElementById("saveQuestion")
                    .textContent =
                    "💾 Save Question";


                loadQuestions();

            })


            .catch(function(error) {

                console.error(
                    "Question Save Error:",
                    error
                );


                showMessage(
                    "❌ " + error.message,
                    false
                );

            });

    });


/* =====================================================
   LOAD QUESTIONS
===================================================== */

function loadQuestions() {

    db.collection("questions")
        .get()

        .then(function(snapshot) {

            const list =
                document.getElementById(
                    "questionsList"
                );


            list.innerHTML = "";


            if (snapshot.empty) {

                list.innerHTML =
                    "<p>No questions added yet.</p>";

                return;

            }


            snapshot.forEach(function(doc) {

                const data =
                    doc.data();


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "question-card";


                let typeName;


                if (data.type === "radio") {

                    typeName =
                        "Single Choice";

                }

                else if (
                    data.type === "checkbox"
                ) {

                    typeName =
                        "Multiple Choice";

                }

                else {

                    typeName =
                        "Text Answer";

                }


                let optionsHTML = "";


                if (
                    data.options &&
                    data.options.length
                ) {

                    optionsHTML =

                        "<strong>Options:</strong>" +

                        "<ol>" +

                        data.options
                            .map(function(option) {

                                return (
                                    "<li>" +
                                    escapeHTML(option) +
                                    "</li>"
                                );

                            })
                            .join("") +

                        "</ol>";

                }


                card.innerHTML = `

                    <strong>
                        Question:
                    </strong>

                    ${escapeHTML(data.question)}

                    <br><br>

                    <strong>
                        Type:
                    </strong>

                    ${typeName}

                    <br><br>

                    ${optionsHTML}

                    <button
                        type="button"
                        class="qm-edit">

                        ✏️ Edit

                    </button>

                    <button
                        type="button"
                        class="qm-delete">

                        🗑️ Delete

                    </button>

                `;


                card
                    .querySelector(".qm-edit")
                    .addEventListener(
                        "click",
                        function() {

                            editQuestion(
                                doc.id,
                                data
                            );

                        }
                    );


                card
                    .querySelector(".qm-delete")
                    .addEventListener(
                        "click",
                        function() {

                            deleteQuestion(
                                doc.id
                            );

                        }
                    );


                list.appendChild(card);

            });

        })


        .catch(function(error) {

            console.error(
                "Question Load Error:",
                error
            );


            document
                .getElementById(
                    "questionsList"
                )
                .textContent =
                "Unable to load questions: " +
                error.message;

        });

}


/* =====================================================
   EDIT QUESTION
===================================================== */

function editQuestion(id, data) {

    editingId = id;


    document
        .getElementById("questionText")
        .value =
        data.question || "";


    document
        .getElementById("questionType")
        .value =
        data.type || "radio";


    const box =
        document.getElementById(
            "optionsBox"
        );


    box.innerHTML = "";


    if (
        data.type === "radio" ||
        data.type === "checkbox"
    ) {

        document
            .getElementById(
                "optionsSection"
            )
            .style.display =
            "block";


        document
            .getElementById(
                "typeInfo"
            )
            .textContent =

            data.type === "radio"

                ? "Single Choice: Respondent can select only one option."

                : "Multiple Choice: Respondent can select multiple options.";


        (data.options || [])
            .forEach(function(option, index) {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "option-row";


                const input =
                    document.createElement(
                        "input"
                    );


                input.type =
                    "text";

                input.className =
                    "option-text";

                input.value =
                    option || "";

                input.placeholder =
                    "Enter Option " +
                    (index + 1);


                const button =
                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";

                button.className =
                    "remove-option";

                button.textContent =
                    "×";


                button.addEventListener(
                    "click",
                    function() {

                        removeOption(
                            button
                        );

                    }
                );


                row.appendChild(input);

                row.appendChild(button);

                box.appendChild(row);

            });

    }

    else {

        document
            .getElementById(
                "optionsSection"
            )
            .style.display =
            "none";

    }


    document
        .getElementById(
            "saveQuestion"
        )
        .textContent =
        "💾 Update Question";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* =====================================================
   DELETE QUESTION
===================================================== */

function deleteQuestion(id) {

    if (
        !confirm(
            "Are you sure you want to delete this question?"
        )
    ) {

        return;

    }


    db.collection("questions")
        .doc(id)
        .delete()

        .then(function() {

            showMessage(
                "✅ Question deleted.",
                true
            );


            loadQuestions();

        })

        .catch(function(error) {

            showMessage(
                "❌ Delete failed: " +
                error.message,
                false
            );

        });

}


/* =====================================================
   RESET OPTIONS
===================================================== */

function resetOptions() {

    const box =
        document.getElementById(
            "optionsBox"
        );


    box.innerHTML = "";


    createDefaultOption(
        "Enter Option 1"
    );


    createDefaultOption(
        "Enter Option 2"
    );

}


function createDefaultOption(placeholder) {

    const box =
        document.getElementById(
            "optionsBox"
        );


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "option-row";


    const input =
        document.createElement(
            "input"
        );


    input.type =
        "text";

    input.className =
        "option-text";

    input.placeholder =
        placeholder;


    const button =
        document.createElement(
            "button"
        );


    button.type =
        "button";

    button.className =
        "remove-option";

    button.textContent =
        "×";


    button.addEventListener(
        "click",
        function() {

            removeOption(
                button
            );

        }
    );


    row.appendChild(input);

    row.appendChild(button);

    box.appendChild(row);

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text, success) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.style.color =
        success
            ? "green"
            : "red";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(
        value === null ||
        value === undefined
            ? ""
            : value
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   INITIAL OPTIONS
===================================================== */

resetOptions();

</script>

</body>
</html>

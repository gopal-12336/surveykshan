<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Surveykshan - Question Management</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
    color:#222;
}

.container{
    width:100%;
    max-width:900px;
    margin:30px auto;
    padding:15px;
}

.box{
    width:100%;
    background:#fff;
    border-radius:12px;
    padding:25px;
    margin-bottom:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.10);
}

h1{
    margin-top:0;
    color:#1565c0;
    text-align:center;
}

h2{
    color:#1565c0;
    margin-top:0;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:6px;
}

.main-input,
select{
    display:block;
    width:100%;
    height:46px;
    padding:10px 12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
    outline:none;
}

.main-input:focus,
select:focus{
    border-color:#1565c0;
}

.type-info{
    margin-top:12px;
    padding:12px;
    background:#eaf3ff;
    color:#1565c0;
    border-radius:7px;
    font-size:14px;
}

/* OPTIONS */

#optionsSection{
    margin-top:20px;
}

#optionsBox{
    width:100%;
}

.option-row{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.optionInput{
    flex:1;
    min-width:0;
    height:46px;
    padding:10px 12px;
    border:2px solid #ddd;
    border-radius:7px;
    font-size:15px;
    outline:none;
    background:#fff;
}

.optionInput:focus{
    border-color:#1565c0;
}

.remove-option{
    flex:0 0 45px;
    width:45px !important;
    height:45px;
    padding:0;
    margin:0;
    background:#d32f2f;
    color:white;
    border:none;
    border-radius:7px;
    font-size:22px;
    cursor:pointer;
}

.remove-option:hover{
    background:#b71c1c;
}

.add{
    width:auto !important;
    background:#2e7d32;
    color:white;
    padding:11px 18px;
    border:none;
    border-radius:7px;
    cursor:pointer;
    font-size:15px;
    margin-top:5px;
}

.add:hover{
    background:#1b5e20;
}

/* BUTTONS */

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:25px;
}

.buttons button{
    flex:1;
    min-width:160px;
    padding:13px;
    border:none;
    border-radius:7px;
    cursor:pointer;
    font-size:15px;
}

.save{
    background:#1565c0;
    color:white;
}

.save:hover{
    background:#0d47a1;
}

.back{
    background:#555;
    color:white;
}

.back:hover{
    background:#333;
}

/* MESSAGE */

#message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
    min-height:20px;
}

/* QUESTION LIST */

.question-card{
    width:100%;
    border:1px solid #ddd;
    border-radius:9px;
    padding:18px;
    margin-top:15px;
    background:#fafafa;
}

.question-card strong{
    color:#333;
}

.question-options{
    margin-top:12px;
}

.question-options li{
    margin-bottom:6px;
}

.card-buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.card-buttons button{
    flex:1;
    padding:10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.edit{
    background:#ef6c00;
    color:white;
}

.delete{
    background:#c62828;
    color:white;
}

/* MOBILE */

@media(max-width:600px){

    .container{
        margin:10px auto;
        padding:10px;
    }

    .box{
        padding:18px;
    }

    .option-row{
        gap:7px;
    }

    .remove-option{
        flex:0 0 42px;
        width:42px !important;
    }

    .buttons{
        flex-direction:column;
    }

    .buttons button{
        width:100%;
    }

    .card-buttons{
        flex-direction:column;
    }

}

</style>
</head>

<body>

<div class="container">

<!-- QUESTION CREATOR -->

<div class="box">

<h1>Surveykshan</h1>

<h2>⚙️ Question Management</h2>

<label for="questionText">
Question
</label>

<input
    class="main-input"
    type="text"
    id="questionText"
    placeholder="Enter your question">

<label for="questionType">
Question Type
</label>

<select id="questionType">

<option value="radio">
Single Choice — Select One
</option>

<option value="checkbox">
Multiple Choice — Select Multiple
</option>

<option value="text">
Text Answer
</option>

</select>

<div
    id="typeInfo"
    class="type-info">
Single Choice: Respondent can select only one option.
</div>

<!-- OPTIONS -->

<div id="optionsSection">

<label>
Answer Options
</label>

<div id="optionsBox">

<div class="option-row">

<input
    class="optionInput"
    type="text"
    placeholder="Option 1">

<button
    type="button"
    class="remove-option">
×
</button>

</div>

<div class="option-row">

<input
    class="optionInput"
    type="text"
    placeholder="Option 2">

<button
    type="button"
    class="remove-option">
×
</button>

</div>

<div class="option-row">

<input
    class="optionInput"
    type="text"
    placeholder="Option 3">

<button
    type="button"
    class="remove-option">
×
</button>

</div>

<div class="option-row">

<input
    class="optionInput"
    type="text"
    placeholder="Option 4">

<button
    type="button"
    class="remove-option">
×
</button>

</div>

</div>

<button
    type="button"
    id="addOption"
    class="add">
+ Add Option
</button>

</div>

<div class="buttons">

<button
    type="button"
    id="saveQuestion"
    class="save">
💾 Save Question
</button>

<button
    type="button"
    class="back"
    onclick="window.location.href='admin.html'">
← Admin Dashboard
</button>

</div>

<p id="message"></p>

</div>


<!-- EXISTING QUESTIONS -->

<div class="box">

<h2>📋 Existing Questions</h2>

<div id="questionsList">
Loading questions...
</div>

</div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>

<!-- QUESTION MANAGEMENT JS -->

<script src="questions.js"></script>

</body>
</html>

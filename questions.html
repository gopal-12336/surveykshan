<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Surveykshan - Question Management</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    background:#f4f6f9;
    font-family:Arial,sans-serif;
    margin:0;
}

.container{
    max-width:900px;
    margin:30px auto;
    padding:20px;
}

.box{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
    margin-bottom:20px;
}

h1,h2{
    color:#1565c0;
}

input,select,textarea{
    width:100%;
    padding:11px;
    margin:7px 0;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

button{
    padding:10px 16px;
    border:0;
    border-radius:6px;
    cursor:pointer;
    margin:5px;
    font-size:14px;
}

.save{
    background:#1565c0;
    color:white;
}

.delete{
    background:#c62828;
    color:white;
}

.edit{
    background:#ef6c00;
    color:white;
}

.back{
    background:#555;
    color:white;
}

.add{
    background:#2e7d32;
    color:white;
}

.option-row{
    display:flex;
    gap:5px;
    align-items:center;
}

.option-row input{
    flex:1;
}

.remove-option{
    background:#c62828;
    color:white;
}

.question-card{
    border:1px solid #ddd;
    padding:15px;
    margin-top:15px;
    border-radius:8px;
    background:#fafafa;
}

.type-info{
    background:#e3f2fd;
    padding:10px;
    border-radius:6px;
    margin-top:10px;
    color:#1565c0;
    font-size:14px;
}

</style>

</head>

<body>

<div class="container">


<!-- QUESTION CREATOR -->

<div class="box">

<h1>Surveykshan</h1>

<h2>⚙️ Question Management</h2>

<label>
<strong>Question</strong>
</label>

<input
type="text"
id="questionText"
placeholder="Enter your question">


<label>
<strong>Question Type</strong>
</label>

<select id="questionType">

<option value="radio">
Single Choice — Select One
</option>

<option value="checkbox">
Multiple Choice — Select Multiple
</option>

<option value="text">
Text Answer
</option>

</select>


<div
class="type-info"
id="typeInfo">

Single Choice: Respondent can select only one option.

</div>


<!-- OPTIONS -->

<div id="optionsSection">

<h3>Answer Options</h3>

<div id="optionsBox">

<div class="option-row">

<input
class="optionInput"
type="text"
placeholder="Option 1">

<button
type="button"
class="remove-option"
onclick="removeOption(this)">
×
</button>

</div>


<div class="option-row">

<input
class="optionInput"
type="text"
placeholder="Option 2">

<button
type="button"
class="remove-option"
onclick="removeOption(this)">
×
</button>

</div>


<div class="option-row">

<input
class="optionInput"
type="text"
placeholder="Option 3">

<button
type="button"
class="remove-option"
onclick="removeOption(this)">
×
</button>

</div>


<div class="option-row">

<input
class="optionInput"
type="text"
placeholder="Option 4">

<button
type="button"
class="remove-option"
onclick="removeOption(this)">
×
</button>

</div>

</div>


<button
type="button"
class="add"
onclick="addOption()">

+ Add Option

</button>

</div>


<br>


<button
class="save"
id="saveQuestion">

💾 Save Question

</button>


<button
class="back"
type="button"
onclick="window.location.href='admin.html'">

← Admin Dashboard

</button>


<p id="message"></p>

</div>


<!-- EXISTING QUESTIONS -->

<div class="box">

<h2>📋 Existing Questions</h2>

<div id="questionsList">

Loading questions...

</div>

</div>


</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>


<script>

const ADMIN_EMAIL =
"goswamivinod2305@gmail.com";

let editingId = null;


// =====================================
// AUTH
// =====================================

firebase.auth().onAuthStateChanged(function(user){

    if(!user){

        window.location.href="index.html";

        return;

    }


    if(
        !user.email ||
        user.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ){

        window.location.href="survey.html";

        return;

    }


    loadQuestions();

});


// =====================================
// QUESTION TYPE
// =====================================

document
.getElementById("questionType")
.addEventListener("change",function(){

    const type=this.value;

    const optionsSection=
        document.getElementById(
            "optionsSection"
        );

    const typeInfo=
        document.getElementById(
            "typeInfo"
        );


    if(type==="radio"){

        optionsSection.style.display="block";

        typeInfo.textContent=
        "Single Choice: Respondent can select only one option.";

    }


    else if(type==="checkbox"){

        optionsSection.style.display="block";

        typeInfo.textContent=
        "Multiple Choice: Respondent can select more than one option.";

    }


    else{

        optionsSection.style.display="none";

        typeInfo.textContent=
        "Text Answer: Respondent will type an answer.";

    }

});


// =====================================
// ADD OPTION
// =====================================

function addOption(){

    const box=
        document.getElementById(
            "optionsBox"
        );


    const count=
        box.querySelectorAll(
            ".optionInput"
        ).length + 1;


    const row=
        document.createElement("div");

    row.className="option-row";


    row.innerHTML=`

        <input
            class="optionInput"
            type="text"
            placeholder="Option ${count}">

        <button
            type="button"
            class="remove-option"
            onclick="removeOption(this)">
            ×
        </button>

    `;


    box.appendChild(row);

}


// =====================================
// REMOVE OPTION
// =====================================

function removeOption(button){

    const box=
        document.getElementById(
            "optionsBox"
        );


    const rows=
        box.querySelectorAll(
            ".option-row"
        );


    if(rows.length<=2){

        showMessage(
            "At least 2 options are required.",
            false
        );

        return;

    }


    button.parentElement.remove();

}


// =====================================
// SAVE QUESTION
// =====================================

document
.getElementById("saveQuestion")
.addEventListener("click",function(){

    const question=
        document
        .getElementById("questionText")
        .value
        .trim();


    const type=
        document
        .getElementById("questionType")
        .value;


    if(!question){

        showMessage(
            "Please enter question.",
            false
        );

        return;

    }


    let options=[];


    if(
        type==="radio" ||
        type==="checkbox"
    ){

        document
        .querySelectorAll(".optionInput")
        .forEach(function(input){

            const value=
                input.value.trim();


            if(value){

                options.push(value);

            }

        });


        if(options.length<2){

            showMessage(
                "Please add at least 2 options.",
                false
            );

            return;

        }

    }


    const data={

        question:question,

        type:type,

        options:options,

        updatedAt:
            firebase.firestore
            .FieldValue
            .serverTimestamp()

    };


    let operation;


    if(editingId){

        operation=
            db.collection("questions")
            .doc(editingId)
            .update(data);

    }

    else{

        operation=
            db.collection("questions")
            .add({

                ...data,

                createdAt:
                    firebase.firestore
                    .FieldValue
                    .serverTimestamp()

            });

    }


    operation

    .then(function(){

        showMessage(
            editingId
            ? "✅ Question updated successfully."
            : "✅ Question saved successfully.",
            true
        );


        editingId=null;


        document
        .getElementById("questionText")
        .value="";


        document
        .getElementById("questionType")
        .value="radio";


        resetOptions();


        document
        .getElementById("saveQuestion")
        .textContent=
        "💾 Save Question";


        loadQuestions();

    })


    .catch(function(error){

        console.error(
            "Question Save Error:",
            error
        );


        showMessage(
            "❌ "+error.message,
            false
        );

    });

});


// =====================================
// LOAD QUESTIONS
// =====================================

function loadQuestions(){

    db.collection("questions")
    .get()

    .then(function(snapshot){

        const list=
            document.getElementById(
                "questionsList"
            );


        list.innerHTML="";


        if(snapshot.empty){

            list.innerHTML=
            "<p>No questions added yet.</p>";

            return;

        }


        snapshot.forEach(function(doc){

            const data=doc.data();


            const card=
                document.createElement(
                    "div"
                );


            card.className=
                "question-card";


            let typeName="";


            if(data.type==="radio"){

                typeName=
                "Single Choice";

            }

            else if(data.type==="checkbox"){

                typeName=
                "Multiple Choice";

            }

            else{

                typeName=
                "Text Answer";

            }


            let optionsHTML="";


            if(
                data.options &&
                data.options.length
            ){

                optionsHTML=
                "<strong>Options:</strong><ol>"+

                data.options
                .map(function(option){

                    return "<li>"+
                    escapeHTML(option)+
                    "</li>";

                })
                .join("")+

                "</ol>";

            }


            card.innerHTML=`

                <strong>
                    Question:
                </strong>

                ${escapeHTML(data.question)}

                <br><br>

                <strong>
                    Type:
                </strong>

                ${typeName}

                <br><br>

                ${optionsHTML}

                <button
                    class="edit">
                    ✏️ Edit
                </button>

                <button
                    class="delete">
                    🗑️ Delete
                </button>

            `;


            card
            .querySelector(".edit")
            .onclick=function(){

                editQuestion(
                    doc.id,
                    data
                );

            };


            card
            .querySelector(".delete")
            .onclick=function(){

                deleteQuestion(
                    doc.id
                );

            };


            list.appendChild(card);

        });

    })


    .catch(function(error){

        console.error(
            "Question Load Error:",
            error
        );


        document
        .getElementById(
            "questionsList"
        )
        .textContent=
        "Unable to load questions: "+
        error.message;

    });

}


// =====================================
// EDIT QUESTION
// =====================================

function editQuestion(id,data){

    editingId=id;


    document
    .getElementById("questionText")
    .value=
        data.question || "";


    document
    .getElementById("questionType")
    .value=
        data.type || "radio";


    const box=
        document.getElementById(
            "optionsBox"
        );


    box.innerHTML="";


    if(
        data.type==="radio" ||
        data.type==="checkbox"
    ){

        document
        .getElementById(
            "optionsSection"
        )
        .style.display="block";


        (data.options || [])
        .forEach(function(option,index){

            const row=
                document.createElement(
                    "div"
                );


            row.className=
                "option-row";


            row.innerHTML=`

                <input
                    class="optionInput"
                    type="text"
                    value="${escapeHTML(option)}"
                    placeholder="Option ${index+1}">

                <button
                    type="button"
                    class="remove-option"
                    onclick="removeOption(this)">
                    ×
                </button>

            `;


            box.appendChild(row);

        });

    }

    else{

        document
        .getElementById(
            "optionsSection"
        )
        .style.display="none";

    }


    document
    .getElementById(
        "saveQuestion"
    )
    .textContent=
        "💾 Update Question";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


// =====================================
// DELETE QUESTION
// =====================================

function deleteQuestion(id){

    if(
        !confirm(
            "Are you sure you want to delete this question?"
        )
    ){

        return;

    }


    db.collection("questions")
    .doc(id)
    .delete()


    .then(function(){

        showMessage(
            "✅ Question deleted.",
            true
        );


        loadQuestions();

    })


    .catch(function(error){

        showMessage(
            "❌ Delete failed: "+
            error.message,
            false
        );

    });

}


// =====================================
// RESET OPTIONS
// =====================================

function resetOptions(){

    const box=
        document.getElementById(
            "optionsBox"
        );


    box.innerHTML=`


        <div class="option-row">

            <input
                class="optionInput"
                type="text"
                placeholder="Option 1">

            <button
                type="button"
                class="remove-option"
                onclick="removeOption(this)">
                ×
            </button>

        </div>


        <div class="option-row">

            <input
                class="optionInput"
                type="text"
                placeholder="Option 2">

            <button
                type="button"
                class="remove-option"
                onclick="removeOption(this)">
                ×
            </button>

        </div>


        <div class="option-row">

            <input
                class="optionInput"
                type="text"
                placeholder="Option 3">

            <button
                type="button"
                class="remove-option"
                onclick="removeOption(this)">
                ×
            </button>

        </div>


        <div class="option-row">

            <input
                class="optionInput"
                type="text"
                placeholder="Option 4">

            <button
                type="button"
                class="remove-option"
                onclick="removeOption(this)">
                ×
            </button>

        </div>

    `;

}


// =====================================
// MESSAGE
// =====================================

function showMessage(text,success){

    const message=
        document.getElementById(
            "message"
        );


    message.textContent=text;


    message.style.color=
        success
        ? "green"
        : "red";

}


// =====================================
// ESCAPE HTML
// =====================================

function escapeHTML(value){

    return String(value || "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>

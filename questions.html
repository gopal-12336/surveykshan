<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surveykshan - Question Management</title>
<link rel="stylesheet" href="style.css">

<style>
body{
    background:#f4f6f9;
    font-family:Arial,sans-serif;
    margin:0;
}
.container{
    max-width:900px;
    margin:30px auto;
    padding:20px;
}
.box{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
    margin-bottom:20px;
}
h1,h2{
    color:#1565c0;
}
input,select,textarea{
    width:100%;
    padding:11px;
    margin:7px 0;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:6px;
}
button{
    padding:10px 16px;
    border:0;
    border-radius:6px;
    cursor:pointer;
    margin:5px;
}
.save{
    background:#1565c0;
    color:white;
}
.delete{
    background:#c62828;
    color:white;
}
.edit{
    background:#ef6c00;
    color:white;
}
.back{
    background:#555;
    color:white;
}
.option{
    display:flex;
    gap:5px;
}
.question-card{
    border:1px solid #ddd;
    padding:15px;
    margin-top:15px;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<div class="box">

<h1>Surveykshan</h1>
<h2>Question Management</h2>

<input
type="text"
id="questionText"
placeholder="Enter Question">

<select id="questionType">
<option value="radio">Single Choice</option>
<option value="text">Text Answer</option>
</select>

<div id="optionsBox">

<input
class="optionInput"
type="text"
placeholder="Option 1">

<input
class="optionInput"
type="text"
placeholder="Option 2">

<input
class="optionInput"
type="text"
placeholder="Option 3">

<input
class="optionInput"
type="text"
placeholder="Option 4">

</div>

<button
type="button"
onclick="addOption()">
+ Add Option
</button>

<br>

<button
class="save"
id="saveQuestion">
💾 Save Question
</button>

<button
class="back"
onclick="window.location.href='admin.html'">
← Admin Dashboard
</button>

<p id="message"></p>

</div>

<div class="box">

<h2>📋 Existing Questions</h2>

<div id="questionsList">
Loading questions...
</div>

</div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>

<script>

const ADMIN_EMAIL = "goswamivinod2305@gmail.com";

let editingId = null;

firebase.auth().onAuthStateChanged(function(user){

    if(!user){
        window.location.href="index.html";
        return;
    }

    if(
        !user.email ||
        user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()
    ){
        window.location.href="survey.html";
        return;
    }

    loadQuestions();

});


function addOption(){

    const input = document.createElement("input");

    input.type="text";
    input.className="optionInput";
    input.placeholder="New Option";

    document.getElementById("optionsBox")
        .appendChild(input);

}


document.getElementById("questionType")
.addEventListener("change",function(){

    const box=document.getElementById("optionsBox");

    if(this.value==="text"){

        box.style.display="none";

    }else{

        box.style.display="block";

    }

});


document.getElementById("saveQuestion")
.addEventListener("click",function(){

    const question =
        document.getElementById("questionText")
        .value.trim();

    const type =
        document.getElementById("questionType")
        .value;

    if(!question){

        showMessage("Please enter question.",false);
        return;

    }

    let options=[];

    if(type==="radio"){

        document.querySelectorAll(".optionInput")
        .forEach(function(input){

            const value=input.value.trim();

            if(value){
                options.push(value);
            }

        });

        if(options.length<2){

            showMessage(
                "Please add at least 2 options.",
                false
            );

            return;
        }

    }

    const data={
        question:question,
        type:type,
        options:options,
        updatedAt:
            firebase.firestore.FieldValue.serverTimestamp()
    };

    const operation = editingId

        ? db.collection("questions")
            .doc(editingId)
            .update(data)

        : db.collection("questions")
            .add({
                ...data,
                createdAt:
                    firebase.firestore.FieldValue.serverTimestamp()
            });

    operation.then(function(){

        showMessage(
            editingId
            ? "✅ Question updated."
            : "✅ Question saved.",
            true
        );

        editingId=null;

        document.getElementById("questionText").value="";

        document.querySelectorAll(".optionInput")
        .forEach(function(input){
            input.value="";
        });

        document.getElementById("saveQuestion")
        .textContent="💾 Save Question";

        loadQuestions();

    })
    .catch(function(error){

        console.error(error);

        showMessage(
            "❌ "+error.message,
            false
        );

    });

});


function loadQuestions(){

    db.collection("questions")
    .orderBy("createdAt","asc")
    .get()

    .then(function(snapshot){

        const list=
            document.getElementById("questionsList");

        list.innerHTML="";

        if(snapshot.empty){

            list.innerHTML=
                "<p>No questions added yet.</p>";

            return;

        }

        snapshot.forEach(function(doc){

            const data=doc.data();

            const div=
                document.createElement("div");

            div.className="question-card";

            let options="";

            if(
                data.options &&
                data.options.length
            ){

                options=
                    "<ol>"+
                    data.options.map(function(option){
                        return "<li>"+escapeHTML(option)+"</li>";
                    }).join("")+
                    "</ol>";

            }

            div.innerHTML=

                "<strong>Question:</strong> "+
                escapeHTML(data.question)+

                "<br><br>"+

                "<strong>Type:</strong> "+
                escapeHTML(data.type)+

                options+

                "<button class='edit'>✏️ Edit</button>"+
                "<button class='delete'>🗑️ Delete</button>";

            div.querySelector(".edit")
            .onclick=function(){
                editQuestion(doc.id,data);
            };

            div.querySelector(".delete")
            .onclick=function(){
                deleteQuestion(doc.id);
            };

            list.appendChild(div);

        });

    })
    .catch(function(error){

        console.error(error);

        document.getElementById("questionsList")
        .textContent=
            "Unable to load questions: "+
            error.message;

    });

}


function editQuestion(id,data){

    editingId=id;

    document.getElementById("questionText")
        .value=data.question || "";

    document.getElementById("questionType")
        .value=data.type || "radio";

    const box=
        document.getElementById("optionsBox");

    box.innerHTML="";

    if(data.type==="radio"){

        box.style.display="block";

        (data.options || [])
        .forEach(function(option){

            const input=
                document.createElement("input");

            input.type="text";
            input.className="optionInput";
            input.value=option;

            box.appendChild(input);

        });

    }else{

        box.style.display="none";

    }

    document.getElementById("saveQuestion")
        .textContent="💾 Update Question";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function deleteQuestion(id){

    if(!confirm("Delete this question?")){
        return;
    }

    db.collection("questions")
    .doc(id)
    .delete()

    .then(function(){

        showMessage(
            "Question deleted.",
            true
        );

        loadQuestions();

    })
    .catch(function(error){

        showMessage(
            "Delete failed: "+
            error.message,
            false
        );

    });

}


function escapeHTML(value){

    return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showMessage(text,success){

    const message=
        document.getElementById("message");

    message.textContent=text;

    message.style.color=
        success ? "green" : "red";

}

</script>

</body>
</html>

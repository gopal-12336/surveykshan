<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Surveykshan - Question Manager</title>

<link rel="stylesheet" href="style.css">

<style>

/* ==============================
   BASIC
============================== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    background:#f4f6f9;
    font-family:Arial, sans-serif;
    color:#222;
}

.container{
    width:100%;
    max-width:1000px;
    margin:0 auto;
    padding:20px;
}


/* ==============================
   BOX
============================== */

.box{
    background:#ffffff;
    padding:22px;
    margin-bottom:22px;
    border-radius:14px;
    box-shadow:0 3px 15px rgba(0,0,0,0.10);
}


/* ==============================
   HEADINGS
============================== */

h1{
    margin:0 0 5px 0;
    color:#1565c0;
    font-size:28px;
}

h2{
    color:#1565c0;
    margin-top:10px;
}

h3{
    margin-bottom:10px;
}


/* ==============================
   LABEL
============================== */

label{
    display:block;
    margin-top:12px;
    margin-bottom:5px;
    font-weight:bold;
}


/* ==============================
   GENERAL INPUT
============================== */

input,
select,
textarea{
    width:100%;
    padding:12px;
    margin:5px 0;
    border:1px solid #cfcfcf;
    border-radius:7px;
    font-size:15px;
    background:#fff;
    color:#222;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border:2px solid #1565c0;
}

#questionText{
    height:45px;
}


/* ==============================
   TYPE INFO
============================== */

.type-info{
    margin-top:10px;
    padding:12px;
    background:#e3f2fd;
    color:#1565c0;
    border-radius:7px;
    font-size:14px;
}


/* ==============================
   OPTIONS
============================== */

#optionsSection{
    margin-top:15px;
}

#optionsBox{
    width:100%;
}


/* IMPORTANT OPTION ROW */

.option-row{
    display:flex !important;
    align-items:center !important;
    gap:10px !important;
    width:100% !important;
    margin-bottom:10px !important;
}


/* OPTION INPUT */

.option-row .optionInput{
    flex:1 1 auto !important;
    width:auto !important;
    min-width:0 !important;

    height:44px !important;

    padding:10px 12px !important;
    margin:0 !important;

    background:#ffffff !important;
    color:#222222 !important;

    border:1px solid #cccccc !important;
    border-radius:7px !important;

    font-size:15px !important;
}


/* DELETE BUTTON */

.option-row .remove-option{
    flex:0 0 44px !important;

    width:44px !important;
    min-width:44px !important;

    height:44px !important;

    padding:0 !important;
    margin:0 !important;

    border:none !important;
    border-radius:7px !important;

    background:#c62828 !important;
    color:#ffffff !important;

    font-size:22px !important;
    font-weight:bold !important;

    cursor:pointer !important;
}

.option-row .remove-option:hover{
    background:#a71919 !important;
}


/* ==============================
   BUTTONS
============================== */

button{
    border:none;
    border-radius:7px;
    padding:11px 17px;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.add{
    width:100%;
    margin-top:5px;
    background:#757575;
    color:#fff;
}

.save{
    width:100%;
    margin-top:10px;
    background:#2e7d32;
    color:#fff;
    font-size:16px;
}

.back{
    background:#555;
    color:#fff;
    margin-top:10px;
}


/* ==============================
   MESSAGE
============================== */

#message{
    text-align:center;
    font-weight:bold;
    margin-top:15px;
}


/* ==============================
   EXISTING QUESTIONS
============================== */

.question-card{
    background:#fafafa;
    border:1px solid #ddd;
    border-radius:9px;
    padding:16px;
    margin-top:14px;
}

.question-card strong{
    color:#1565c0;
}

.question-card ol{
    margin-top:8px;
}

.question-card button{
    margin-top:10px;
    margin-right:6px;
}

.edit{
    background:#ef6c00;
    color:#fff;
}

.delete{
    background:#c62828;
    color:#fff;
}


/* ==============================
   MOBILE
============================== */

@media(max-width:600px){

    .container{
        padding:10px;
    }

    .box{
        padding:15px;
    }

    h1{
        font-size:23px;
    }

    .option-row{
        gap:7px !important;
    }

    .option-row .optionInput{
        height:42px !important;
        font-size:14px !important;
    }

    .option-row .remove-option{
        width:42px !important;
        min-width:42px !important;
        height:42px !important;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================
     QUESTION CREATOR
===================================== -->

<div class="box">

<h1>📝 Survey Question Manager</h1>

<p>
यहाँ से आप अपने survey के questions बना सकते हैं।
</p>


<!-- QUESTION -->

<label for="questionText">
Question
</label>

<input
    type="text"
    id="questionText"
    placeholder="Enter your question"
>


<!-- QUESTION TYPE -->

<label for="questionType">
Question Type
</label>

<select id="questionType">

    <option value="radio">
        Single Choice
    </option>

    <option value="checkbox">
        Multiple Choice
    </option>

    <option value="text">
        Text Answer
    </option>

</select>


<!-- TYPE INFORMATION -->

<div
    class="type-info"
    id="typeInfo">

    Single Choice: Respondent can select only one option.

</div>


<!-- OPTIONS -->

<div id="optionsSection">

<h3>Options</h3>

<div id="optionsBox">


<!-- OPTION 1 -->

<div class="option-row">

<input
    class="optionInput"
    type="text"
    placeholder="Enter option 1"
>

<button
    type="button"
    class="remove-option"
    onclick="removeOption(this)">
    ×
</button>

</div>


<!-- OPTION 2 -->

<div class="option-row">

<input
    class="optionInput"
    type="text"
    placeholder="Enter option 2"
>

<button
    type="button"
    class="remove-option"
    onclick="removeOption(this)">
    ×
</button>

</div>


<!-- OPTION 3 -->

<div class="option-row">

<input
    class="optionInput"
    type="text"
    placeholder="Enter option 3"
>

<button
    type="button"
    class="remove-option"
    onclick="removeOption(this)">
    ×
</button>

</div>


<!-- OPTION 4 -->

<div class="option-row">

<input
    class="optionInput"
    type="text"
    placeholder="Enter option 4"
>

<button
    type="button"
    class="remove-option"
    onclick="removeOption(this)">
    ×
</button>

</div>


</div>


<!-- ADD OPTION -->

<button
    type="button"
    class="add"
    onclick="addOption()">

    + Add Option

</button>

</div>


<!-- SAVE -->

<button
    type="button"
    class="save"
    id="saveQuestion">

    💾 Save Question

</button>


<!-- BACK -->

<button
    type="button"
    class="back"
    onclick="window.location.href='admin.html'">

    ← Admin Dashboard

</button>


<p id="message"></p>

</div>



<!-- =====================================
     EXISTING QUESTIONS
===================================== -->

<div class="box">

<h2>📋 Existing Questions</h2>

<div id="questionsList">

Loading questions...

</div>

</div>


</div>



<!-- =====================================
     FIREBASE
===================================== -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>



<script>


/* =====================================
   ADMIN EMAIL
===================================== */

const ADMIN_EMAIL =
"goswamivinod2305@gmail.com";


let editingId = null;


/* =====================================
   AUTHENTICATION
===================================== */

firebase.auth().onAuthStateChanged(function(user){

    if(!user){

        window.location.href="index.html";

        return;

    }


    if(
        !user.email ||
        user.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ){

        window.location.href="survey.html";

        return;

    }


    loadQuestions();

});



/* =====================================
   QUESTION TYPE CHANGE
===================================== */

document
.getElementById("questionType")
.addEventListener("change",function(){

    const type=this.value;

    const optionsSection =
        document.getElementById("optionsSection");

    const typeInfo =
        document.getElementById("typeInfo");


    if(type==="radio"){

        optionsSection.style.display="block";

        typeInfo.textContent =
        "Single Choice: Respondent can select only one option.";

    }


    else if(type==="checkbox"){

        optionsSection.style.display="block";

        typeInfo.textContent =
        "Multiple Choice: Respondent can select more than one option.";

    }


    else{

        optionsSection.style.display="none";

        typeInfo.textContent =
        "Text Answer: Respondent will type an answer.";

    }

});



/* =====================================
   ADD OPTION
===================================== */

function addOption(){

    const box =
        document.getElementById("optionsBox");


    const count =
        box.querySelectorAll(".optionInput").length + 1;


    const row =
        document.createElement("div");

    row.className="option-row";


    row.innerHTML = `

        <input
            class="optionInput"
            type="text"
            placeholder="Enter option ${count}"
        >

        <button
            type="button"
            class="remove-option"
            onclick="removeOption(this)">
            ×
        </button>

    `;


    box.appendChild(row);

}



/* =====================================
   REMOVE OPTION
===================================== */

function removeOption(button){

    const box =
        document.getElementById("optionsBox");


    const rows =
        box.querySelectorAll(".option-row");


    if(rows.length <= 2){

        showMessage(
            "At least 2 options are required.",
            false
        );

        return;

    }


    button.parentElement.remove();

}



/* =====================================
   SAVE QUESTION
===================================== */

document
.getElementById("saveQuestion")
.addEventListener("click",function(){

    const question =
        document
        .getElementById("questionText")
        .value
        .trim();


    const type =
        document
        .getElementById("questionType")
        .value;


    if(!question){

        showMessage(
            "Please enter question.",
            false
        );

        return;

    }


    let options=[];


    if(
        type==="radio" ||
        type==="checkbox"
    ){

        document
        .querySelectorAll(".optionInput")
        .forEach(function(input){

            const value =
                input.value.trim();


            if(value){

                options.push(value);

            }

        });


        if(options.length < 2){

            showMessage(
                "Please enter at least 2 options.",
                false
            );

            return;

        }

    }


    const data = {

        question: question,

        type: type,

        options: options,

        updatedAt:
            firebase.firestore
            .FieldValue
            .serverTimestamp()

    };


    let operation;


    /* UPDATE */

    if(editingId){

        operation =
            db.collection("questions")
            .doc(editingId)
            .update(data);

    }


    /* NEW QUESTION */

    else{

        operation =
            db.collection("questions")
            .add({

                ...data,

                createdAt:
                    firebase.firestore
                    .FieldValue
                    .serverTimestamp()

            });

    }


    operation

    .then(function(){

        showMessage(

            editingId
            ? "✅ Question updated successfully."
            : "✅ Question saved successfully.",

            true

        );


        editingId=null;


        document
        .getElementById("questionText")
        .value="";


        document
        .getElementById("questionType")
        .value="radio";


        document
        .getElementById("optionsSection")
        .style.display="block";


        document
        .getElementById("typeInfo")
        .textContent =
        "Single Choice: Respondent can select only one option.";


        resetOptions();


        document
        .getElementById("saveQuestion")
        .textContent =
        "💾 Save Question";


        loadQuestions();

    })


    .catch(function(error){

        console.error(
            "Question Save Error:",
            error
        );


        showMessage(
            "❌ " + error.message,
            false
        );

    });

});



/* =====================================
   LOAD QUESTIONS
===================================== */

function loadQuestions(){

    db.collection("questions")
    .get()

    .then(function(snapshot){

        const list =
            document.getElementById(
                "questionsList"
            );


        list.innerHTML="";


        if(snapshot.empty){

            list.innerHTML =
            "<p>No questions added yet.</p>";

            return;

        }


        let number=1;


        snapshot.forEach(function(doc){

            const data=doc.data();


            const card =
                document.createElement("div");


            card.className =
                "question-card";


            let typeName="";


            if(data.type==="radio"){

                typeName="Single Choice";

            }

            else if(data.type==="checkbox"){

                typeName="Multiple Choice";

            }

            else{

                typeName="Text Answer";

            }


            let optionsHTML="";


            if(
                data.options &&
                data.options.length > 0
            ){

                optionsHTML =

                "<strong>Options:</strong><ol>" +

                data.options
                .map(function(option){

                    return "<li>" +
                        escapeHTML(option) +
                        "</li>";

                })
                .join("") +

                "</ol>";

            }


            card.innerHTML = `

                <strong>
                    ${number}.
                    Question:
                </strong>

                ${escapeHTML(data.question)}

                <br><br>

                <strong>
                    Type:
                </strong>

                ${typeName}

                <br><br>

                ${optionsHTML}

                <button
                    type="button"
                    class="edit">

                    ✏️ Edit

                </button>

                <button
                    type="button"
                    class="delete">

                    🗑️ Delete

                </button>

            `;


            /* EDIT */

            card
            .querySelector(".edit")
            .onclick=function(){

                editQuestion(
                    doc.id,
                    data
                );

            };


            /* DELETE */

            card
            .querySelector(".delete")
            .onclick=function(){

                deleteQuestion(
                    doc.id
                );

            };


            list.appendChild(card);


            number++;

        });

    })


    .catch(function(error){

        console.error(
            "Question Load Error:",
            error
        );


        document
        .getElementById(
            "questionsList"
        )
        .textContent =
        "Unable to load questions: " +
        error.message;

    });

}



/* =====================================
   EDIT QUESTION
===================================== */

function editQuestion(id,data){

    editingId=id;


    document
    .getElementById("questionText")
    .value =
        data.question || "";


    document
    .getElementById("questionType")
    .value =
        data.type || "radio";


    const box =
        document.getElementById(
            "optionsBox"
        );


    box.innerHTML="";


    if(
        data.type==="radio" ||
        data.type==="checkbox"
    ){

        document
        .getElementById(
            "optionsSection"
        )
        .style.display="block";


        document
        .getElementById(
            "typeInfo"
        )
        .textContent =

        data.type==="radio"

        ? "Single Choice: Respondent can select only one option."

        : "Multiple Choice: Respondent can select more than one option.";


        (data.options || [])
        .forEach(function(option,index){

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "option-row";


            const input =
                document.createElement(
                    "input"
                );


            input.className =
                "optionInput";


            input.type="text";


            input.value =
                option || "";


            input.placeholder =
                "Enter option " +
                (index+1);


            const removeButton =
                document.createElement(
                    "button"
                );


            removeButton.type="button";


            removeButton.className =
                "remove-option";


            removeButton.textContent="×";


            removeButton.onclick =
                function(){

                    removeOption(
                        removeButton
                    );

                };


            row.appendChild(input);

            row.appendChild(removeButton);

            box.appendChild(row);

        });

    }


    else{

        document
        .getElementById(
            "optionsSection"
        )
        .style.display="none";


        document
        .getElementById(
            "typeInfo"
        )
        .textContent =
        "Text Answer: Respondent will type an answer.";

    }


    document
    .getElementById(
        "saveQuestion"
    )
    .textContent =
    "💾 Update Question";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}



/* =====================================
   DELETE QUESTION
===================================== */

function deleteQuestion(id){

    if(
        !confirm(
            "Are you sure you want to delete this question?"
        )
    ){

        return;

    }


    db.collection("questions")
    .doc(id)
    .delete()

    .then(function(){

        showMessage(
            "✅ Question deleted.",
            true
        );


        loadQuestions();

    })

    .catch(function(error){

        showMessage(
            "❌ Delete failed: " +
            error.message,
            false
        );

    });

}



/* =====================================
   RESET OPTIONS
===================================== */

function resetOptions(){

    const box =
        document.getElementById(
            "optionsBox"
        );


    box.innerHTML = `

        <div class="option-row">

            <input
                class="optionInput"
                type="text"
                placeholder="Enter option 1"
            >

            <button
                type="button"
                class="remove-option"
                onclick="removeOption(this)">
                ×
            </button>

        </div>


        <div class="option-row">

            <input
                class="optionInput"
                type="text"
                placeholder="Enter option 2"
            >

            <button
                type="button"
                class="remove-option"
                onclick="removeOption(this)">
                ×
            </button>

        </div>


        <div class="option-row">

            <input
                class="optionInput"
                type="text"
                placeholder="Enter option 3"
            >

            <button
                type="button"
                class="remove-option"
                onclick="removeOption(this)">
                ×
            </button>

        </div>


        <div class="option-row">

            <input
                class="optionInput"
                type="text"
                placeholder="Enter option 4"
            >

            <button
                type="button"
                class="remove-option"
                onclick="removeOption(this)">
                ×
            </button>

        </div>

    `;

}



/* =====================================
   MESSAGE
===================================== */

function showMessage(text,success){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent=text;


    message.style.color =
        success
        ? "green"
        : "red";

}



/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(value){

    return String(value || "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

</script>


</body>

</html>

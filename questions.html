<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Surveykshan - Survey</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
    background:#f4f6f9;
    color:#222;
}

.container{
    width:100%;
    max-width:700px;
    margin:0 auto;
    padding:20px;
}

.header{
    background:#1565c0;
    color:white;
    padding:20px;
    border-radius:12px;
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    margin:0 0 5px;
    font-size:28px;
}

.header p{
    margin:0;
    font-size:14px;
}

.card{
    background:white;
    padding:22px;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.12);
    margin-bottom:20px;
}

.step-title{
    color:#1565c0;
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:12px;
    margin-bottom:5px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#1565c0;
}

textarea{
    min-height:120px;
    resize:vertical;
}

.question-number{
    color:#777;
    font-size:14px;
    margin-bottom:8px;
}

.question-text{
    font-size:20px;
    font-weight:bold;
    line-height:1.5;
    margin-bottom:20px;
}

.option-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.option{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px;
    border:1px solid #ddd;
    border-radius:8px;
    cursor:pointer;
    background:#fff;
    transition:.2s;
}

.option:hover{
    background:#f1f7ff;
    border-color:#1565c0;
}

.option input{
    width:20px;
    height:20px;
    margin:0;
    flex-shrink:0;
}

.option span{
    font-size:16px;
}

.navigation{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:25px;
}

button{
    border:0;
    border-radius:7px;
    padding:12px 22px;
    font-size:15px;
    cursor:pointer;
}

.next-btn{
    background:#1565c0;
    color:white;
}

.prev-btn{
    background:#666;
    color:white;
}

.submit-btn{
    background:#2e7d32;
    color:white;
    width:100%;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.progress-area{
    margin-bottom:20px;
}

.progress-text{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:#555;
    margin-bottom:6px;
}

.progress{
    width:100%;
    height:8px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#1565c0;
    transition:.3s;
}

.message{
    text-align:center;
    padding:10px;
    font-size:14px;
}

.error{
    color:#c62828;
}

.success{
    color:#2e7d32;
}

.hidden{
    display:none !important;
}

.loading{
    text-align:center;
    padding:30px;
    color:#666;
}

.success-box{
    text-align:center;
    padding:35px 20px;
}

.success-icon{
    font-size:55px;
    margin-bottom:15px;
}

.success-box h2{
    color:#2e7d32;
}

.small-note{
    color:#777;
    font-size:13px;
    margin-top:10px;
}

@media(max-width:500px){

    .container{
        padding:12px;
    }

    .card{
        padding:18px;
    }

    .header h1{
        font-size:24px;
    }

    .question-text{
        font-size:18px;
    }

    .navigation button{
        flex:1;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>Surveykshan</h1>

        <p>Political Survey</p>

    </div>


    <!-- BASIC DETAILS -->

    <div id="basicDetailsCard" class="card">

        <div class="step-title">
            Respondent Details
        </div>

        <p class="small-note">
            कृपया respondent की basic information भरें।
        </p>


        <label>
            Full Name / पूरा नाम
        </label>

        <input
            type="text"
            id="respondentName"
            placeholder="Enter full name">


        <label>
            Mobile Number / मोबाइल नंबर
        </label>

        <input
            type="tel"
            id="respondentMobile"
            placeholder="Enter mobile number"
            maxlength="10">


        <label>
            Age / आयु
        </label>

        <input
            type="number"
            id="respondentAge"
            placeholder="Enter age"
            min="1"
            max="120">


        <label>
            Gender / लिंग
        </label>

        <select id="respondentGender">

            <option value="">
                Select Gender
            </option>

            <option value="Male">
                Male / पुरुष
            </option>

            <option value="Female">
                Female / महिला
            </option>

            <option value="Other">
                Other / अन्य
            </option>

        </select>


        <label>
            Village / City
        </label>

        <input
            type="text"
            id="respondentVillage"
            placeholder="Village / City">


        <label>
            Assembly Constituency
        </label>

        <input
            type="text"
            id="respondentAssembly"
            placeholder="Assembly Constituency">


        <div
            id="basicMessage"
            class="message">
        </div>


        <button
            type="button"
            class="next-btn"
            style="width:100%;"
            onclick="startSurvey()">

            Next →

        </button>

    </div>


    <!-- QUESTION AREA -->

    <div
        id="questionArea"
        class="hidden">


        <!-- PROGRESS -->

        <div class="progress-area">

            <div class="progress-text">

                <span id="progressText">
                    Question 1
                </span>

                <span id="progressPercent">
                    0%
                </span>

            </div>


            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar">
                </div>

            </div>

        </div>


        <!-- QUESTION CARD -->

        <div class="card">

            <div
                id="questionNumber"
                class="question-number">
            </div>


            <div
                id="questionText"
                class="question-text">
            </div>


            <div
                id="optionsContainer"
                class="option-list">
            </div>


            <div
                id="answerMessage"
                class="message">
            </div>


            <!-- NAVIGATION -->

            <div
                id="navigation"
                class="navigation">

                <button
                    type="button"
                    id="previousButton"
                    class="prev-btn"
                    onclick="previousQuestion()">

                    ← Previous

                </button>


                <button
                    type="button"
                    id="nextButton"
                    class="next-btn"
                    onclick="nextQuestion()">

                    Next →

                </button>

            </div>


            <button
                type="button"
                id="submitButton"
                class="submit-btn hidden"
                onclick="submitSurvey()">

                Submit Survey ✓

            </button>

        </div>

    </div>


    <!-- SUCCESS -->

    <div
        id="successArea"
        class="card success-box hidden">

        <div class="success-icon">
            ✅
        </div>

        <h2>
            Survey Submitted Successfully
        </h2>

        <p>
            Thank you for participating in the survey.
        </p>

        <p>
            आपका response successfully save हो गया है।
        </p>

    </div>


    <!-- LOADING -->

    <div
        id="loadingArea"
        class="card loading hidden">

        Loading questions...

    </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>


<script>

/* =========================================
   VARIABLES
========================================= */

let questions = [];

let currentQuestion = 0;

let answers = {};

let respondentData = {};

let surveyStarted = false;


/* =========================================
   START SURVEY
========================================= */

function startSurvey(){

    const name =
        document
        .getElementById("respondentName")
        .value
        .trim();


    const mobile =
        document
        .getElementById("respondentMobile")
        .value
        .trim();


    const age =
        document
        .getElementById("respondentAge")
        .value
        .trim();


    const gender =
        document
        .getElementById("respondentGender")
        .value;


    const village =
        document
        .getElementById("respondentVillage")
        .value
        .trim();


    const assembly =
        document
        .getElementById("respondentAssembly")
        .value
        .trim();


    const message =
        document.getElementById(
            "basicMessage"
        );


    message.textContent = "";


    if(!name){

        message.textContent =
            "Please enter respondent name.";

        message.className =
            "message error";

        return;

    }


    if(mobile && !/^[0-9]{10}$/.test(mobile)){

        message.textContent =
            "Please enter valid 10 digit mobile number.";

        message.className =
            "message error";

        return;

    }


    if(age){

        const ageNumber =
            Number(age);

        if(ageNumber < 1 || ageNumber > 120){

            message.textContent =
                "Please enter valid age.";

            message.className =
                "message error";

            return;

        }

    }


    respondentData = {

        name:name,

        mobile:mobile,

        age:age,

        gender:gender,

        village:village,

        assembly:assembly

    };


    surveyStarted = true;


    document
    .getElementById("basicDetailsCard")
    .classList.add("hidden");


    document
    .getElementById("questionArea")
    .classList.remove("hidden");


    showQuestion();

}


/* =========================================
   LOAD QUESTIONS
========================================= */

function loadQuestions(){

    document
    .getElementById("loadingArea")
    .classList.remove("hidden");


    db.collection("questions")
    .orderBy("createdAt")
    .get()

    .then(function(snapshot){

        questions = [];


        snapshot.forEach(function(doc){

            const data =
                doc.data();


            questions.push({

                id:doc.id,

                question:
                    data.question || "",

                type:
                    data.type || "radio",

                options:
                    Array.isArray(data.options)
                    ? data.options
                    : []

            });

        });


        document
        .getElementById("loadingArea")
        .classList.add("hidden");


        if(questions.length === 0){

            document
            .getElementById("basicMessage")
            .textContent =
                "No survey questions are available.";

            document
            .getElementById("basicMessage")
            .className =
                "message error";

            document
            .getElementById("basicDetailsCard")
            .classList.remove("hidden");

            return;

        }

    })

    .catch(function(error){

        console.error(
            "Question loading error:",
            error
        );


        document
        .getElementById("loadingArea")
        .classList.add("hidden");


        document
        .getElementById("basicMessage")
        .textContent =
            "Questions load नहीं हो पाए: " +
            error.message;

        document
        .getElementById("basicMessage")
        .className =
            "message error";

    });

}


/* =========================================
   SHOW QUESTION
========================================= */

function showQuestion(){

    if(!questions.length){
        return;
    }


    const question =
        questions[currentQuestion];


    const total =
        questions.length;


    const number =
        currentQuestion + 1;


    const percent =
        Math.round(
            (number / total) * 100
        );


    document
    .getElementById("questionNumber")
    .textContent =
        "Question " +
        number +
        " of " +
        total;


    document
    .getElementById("progressText")
    .textContent =
        "Question " +
        number +
        " / " +
        total;


    document
    .getElementById("progressPercent")
    .textContent =
        percent + "%";


    document
    .getElementById("progressBar")
    .style.width =
        percent + "%";


    document
    .getElementById("questionText")
    .textContent =
        question.question;


    const container =
        document.getElementById(
            "optionsContainer"
        );


    container.innerHTML = "";


    document
    .getElementById("answerMessage")
    .textContent = "";


    /* =====================================
       TEXT ANSWER
    ===================================== */

    if(question.type === "text"){

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.id =
            "textAnswer";


        textarea.placeholder =
            "Type your answer here...";


        textarea.value =
            answers[question.id] || "";


        container.appendChild(
            textarea
        );

    }


    /* =====================================
       RADIO / SINGLE CHOICE
    ===================================== */

    else if(question.type === "radio"){

        question.options
        .forEach(function(option,index){

            const label =
                document.createElement(
                    "label"
                );


            label.className =
                "option";


            const input =
                document.createElement(
                    "input"
                );


            input.type =
                "radio";


            input.name =
                "question_" +
                question.id;


            input.value =
                option;


            if(
                answers[question.id] ===
                option
            ){

                input.checked = true;

            }


            const span =
                document.createElement(
                    "span"
                );


            span.textContent =
                option;


            label.appendChild(
                input
            );


            label.appendChild(
                span
            );


            container.appendChild(
                label
            );

        });

    }


    /* =====================================
       CHECKBOX / MULTIPLE CHOICE
    ===================================== */

    else if(question.type === "checkbox"){

        let selected =
            Array.isArray(
                answers[question.id]
            )
            ? answers[question.id]
            : [];


        question.options
        .forEach(function(option){

            const label =
                document.createElement(
                    "label"
                );


            label.className =
                "option";


            const input =
                document.createElement(
                    "input"
                );


            input.type =
                "checkbox";


            input.name =
                "question_" +
                question.id;


            input.value =
                option;


            if(
                selected.includes(option)
            ){

                input.checked = true;

            }


            const span =
                document.createElement(
                    "span"
                );


            span.textContent =
                option;


            label.appendChild(
                input
            );


            label.appendChild(
                span
            );


            container.appendChild(
                label
            );

        });

    }


    /* =====================================
       BUTTONS
    ===================================== */

    const previousButton =
        document.getElementById(
            "previousButton"
        );


    const nextButton =
        document.getElementById(
            "nextButton"
        );


    const submitButton =
        document.getElementById(
            "submitButton"
        );


    if(currentQuestion === 0){

        previousButton.disabled =
            true;

    }

    else{

        previousButton.disabled =
            false;

    }


    if(currentQuestion === total - 1){

        nextButton.classList.add(
            "hidden"
        );

        submitButton.classList.remove(
            "hidden"
        );

    }

    else{

        nextButton.classList.remove(
            "hidden"
        );

        submitButton.classList.add(
            "hidden"
        );

    }

}


/* =========================================
   GET CURRENT ANSWER
========================================= */

function getCurrentAnswer(){

    const question =
        questions[currentQuestion];


    if(question.type === "text"){

        const input =
            document.getElementById(
                "textAnswer"
            );


        return input
            ? input.value.trim()
            : "";

    }


    if(question.type === "radio"){

        const selected =
            document.querySelector(
                'input[name="question_' +
                question.id +
                '"]:checked'
            );


        return selected
            ? selected.value
            : "";

    }


    if(question.type === "checkbox"){

        const selected =
            [];


        document
        .querySelectorAll(
            'input[name="question_' +
            question.id +
            '"]:checked'
        )
        .forEach(function(input){

            selected.push(
                input.value
            );

        });


        return selected;

    }


    return "";

}


/* =========================================
   VALIDATE ANSWER
========================================= */

function validateCurrentAnswer(){

    const question =
        questions[currentQuestion];


    const answer =
        getCurrentAnswer();


    const message =
        document.getElementById(
            "answerMessage"
        );


    message.textContent = "";


    if(question.type === "checkbox"){

        if(
            !Array.isArray(answer) ||
            answer.length === 0
        ){

            message.textContent =
                "Please select at least one option.";

            message.className =
                "message error";

            return false;

        }

    }

    else{

        if(!answer){

            message.textContent =
                "Please answer this question.";

            message.className =
                "message error";

            return false;

        }

    }


    answers[question.id] =
        answer;


    return true;

}


/* =========================================
   NEXT QUESTION
========================================= */

function nextQuestion(){

    if(!validateCurrentAnswer()){

        return;

    }


    if(
        currentQuestion <
        questions.length - 1
    ){

        currentQuestion++;

        showQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* =========================================
   PREVIOUS QUESTION
========================================= */

function previousQuestion(){

    if(currentQuestion <= 0){

        return;

    }


    /* Save current answer if available */

    const question =
        questions[currentQuestion];


    const answer =
        getCurrentAnswer();


    if(question.type === "checkbox"){

        if(
            Array.isArray(answer) &&
            answer.length > 0
        ){

            answers[question.id] =
                answer;

        }

    }

    else if(answer){

        answers[question.id] =
            answer;

    }


    currentQuestion--;


    showQuestion();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================
   SUBMIT SURVEY
========================================= */

function submitSurvey(){

    if(!validateCurrentAnswer()){

        return;

    }


    const submitButton =
        document.getElementById(
            "submitButton"
        );


    submitButton.disabled =
        true;


    submitButton.textContent =
        "Submitting...";


    const finalData = {

        respondent:
            respondentData,

        answers:
            answers,

        totalQuestions:
            questions.length,

        submittedAt:
            firebase.firestore
            .FieldValue
            .serverTimestamp()

    };


    db.collection("surveyResponses")
    .add(finalData)

    .then(function(){

        document
        .getElementById("questionArea")
        .classList.add("hidden");


        document
        .getElementById("successArea")
        .classList.remove("hidden");


        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    })

    .catch(function(error){

        console.error(
            "Survey Submit Error:",
            error
        );


        submitButton.disabled =
            false;


        submitButton.textContent =
            "Submit Survey ✓";


        const message =
            document.getElementById(
                "answerMessage"
            );


        message.textContent =
            "Survey submit नहीं हुआ: " +
            error.message;

        message.className =
            "message error";

    });

}


/* =========================================
   FIREBASE AUTH
========================================= */

firebase.auth()
.onAuthStateChanged(function(user){

    /*
       अगर आपका survey login के बिना भी
       खुलना चाहिए तो नीचे redirect हटाया जा सकता है.
    */

    loadQuestions();

});


</script>

</body>
</html>
